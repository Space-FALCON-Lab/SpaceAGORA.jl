version = 1

[[scenarios]]
name = "odyssey"
kind = "orbit_events"
planet = "mars"
events = ["peri", "apo"]
telemetry_peri = "data/telemetry/Odyssey/True_Odyssey_periapsis_alts.feather"
telemetry_apo = "data/telemetry/Odyssey/True_Odyssey_apoapsis_alts.feather"
target_orbits_quick = 8
target_orbits_full = 340
compare_points_quick = 8
compare_points_full = 273
min_eval_points = 6
# Exact NAV-solution Cartesian state at the scenario epoch (2001-11-06T19:00:32
# UTC): Odyssey (-53) relative to MARS in J2000 axes, m and m/s, read from the
# mission kernel m01_ab_v2.bsp (spkezr, no aberration correction). This
# overrides the element-based initial condition; the osculating elements below
# are retained for reference only. At the epoch the kernel osculating state is
# r_apo = 28657.502 km, r_peri = 3492.178 km (95.99 km radius altitude),
# TA = 61.16 deg, so the element IC carried a -97.9 km apoapsis-radius and a
# ~114 deg anomaly (epoch-phase) day-one bias into the 340-orbit campaign.
initial_state_j2000_m = [-1055155.262605, -4333732.239384, -728177.837002, -2371.221148294, -764.635541703, -3175.141365850]
ra_m = 2.8559615e7
# Replay corridor value, in radius altitude above Rp_e. The raw NAV sequence
# sits around 91-93 km over the first propagated passes; 95 km made the first
# compared oblate periapsis ~4 km too high (114.33 vs 110.17 km). A 91 km
# replay IC gives the first compared periapsis at 110.34 km.
rp_altitude_m = 91000.0
i_deg = 93.522
aop_deg = 109.7454
raan_deg = 28.1517
ta_deg = 175.0
# NAV-solution osculating elements are referenced to the Mars mean equator
# (areocentric), not J2000: matched against m01_ab_v2.bsp to <=0.05 deg.
element_frame = "body_equator_inertial"
# The telemetry truth product numbers orbits in mission P-numbering (from the
# MOI periapsis); the scenario epoch sits 16 min after periapsis P19, verified
# against the PDS accelerometer archive (odya_0001: L2P020's periapsis matches
# the NAV kernel's 2001-11-07T11:51 passage to the minute) and by an energy
# cross-check of the kernel state against the telemetry decay curve.
epoch_orbit_offset = 19.0
gravity_model = "inverse_squared"
gravity_harmonics_degree = 20
gravity_harmonics_order = 20
gravity_harmonics_file = "data/Gravity_harmonics_data/Mars50c.csv"
nbody_bodies = ["sun", "earth", "moon", "jupiter"]
srp_enabled = true
srp_cr = 1.3
srp_area_m2 = 3.74
include_wind = true
orbit_altitude_mode = "true"
EI_km = 250.0

[scenarios.maneuvers]
# orbit_numbers use mission P-numbering (from the MOI periapsis), the same
# origin as the telemetry truth files. Flight convention per the NAV-kernel
# periapsis-altitude jumps: burn B fires at the apoapsis AFTER periapsis P(B),
# so its effect first appears at P(B+1). The epoch sits 16 min after P19, so
# epoch-relative apoapsis N lies between P(18+N) and P(19+N): offset 18 places
# burn B between P(B) and P(B+1), matching flight. Walk-in burns (7-16) are
# already in the initial condition and are dropped by the offset filter.
orbit_numbers = [7, 10, 12, 14, 16, 25, 32, 45, 49, 53, 66, 74, 88, 91, 99, 105, 129, 146, 179, 197, 213, 229, 241, 257, 270, 282, 295, 306, 318, 330]
delta_v_mps = [-0.549, -0.549, -0.301, -0.151, -0.303, 0.145, -0.151, -0.099, -0.099, -0.2, -0.2, 0.297, -0.149, -0.149, -0.147, 0.144, 0.144, 1.0, 0.844, 0.6, 0.844, 0.6, 0.6, 1.2, 1.0, 1.2, 1.2, 1.0, 1.0, 1.2]
orbit_number_offset = 18
thrust_n = 4.0
isp_s = 220.0
guidance_rate_s = 30.0
control_rate_s = 10.0

[scenarios.atmosphere_truth]
assumption_id = "odyssey_mars_gram_tes_my25_v1"
atmosphere_model = "GRAM"
atmosphere_dataset = "MarsGRAM TES Mapping Year 2 (observed MY25, 2001 storm year)"
space_weather_model = "MarsGRAM deterministic (seeded, perturbations off)"
solar_flux_model = "MarsGRAM epoch-fixed defaults"
gram_seed = 1001
gram_perturbation_scales = [0.0, 0.0, 0.0, 0.0]
# TES Mapping Year 2 selects the observed Mars Year 25 dust fields — the 2001
# global-storm year as actually measured by MGS/TES, spatially and temporally
# resolved. This replaces the hand-built storm trapezoid and manual MGCM dust
# levels used previously: the per-pass accelerometer comparison (odya_0001)
# and restart-from-truth segments both prefer the observed year across the
# campaign. Native default F10.7 is retained on purpose — the TES fields
# already carry the observed state, and forcing the flown F10.7 double-counts.
# Known limit: TES map-edge thinning late in the campaign (documented in the
# lab notes). Note TES data mode costs more per density query than MGCM.
mars_map_year = 2
gram_offline_surrogate = "off"
gram_static_grid = false
gram_track_cache = false
gram_global_lock = "on"

[scenarios.calibration]
enabled = true
profiles = ["full"]
search_on_quick_subset = false
fit_cd_scale = false
cd_scale_min = 1.0
cd_scale_max = 1.0
cd_scale_steps = 3
fit_cr = true
cr_min = 1.15
cr_max = 1.45
cr_steps = 3
fit_bias = true
bias_abs_max_km = 500.0
objective = "mean_nmae"

[scenarios.initial_time]
year = 2001
month = 11
day = 6
hour = 19
minute = 0
second = 32.0

[scenarios.spacecraft]
bus_dims_m = [2.2, 2.6, 1.7]
panel_dims_m = [0.01, 1.945, 1.7]
bus_mass_kg = 391.0
panel_mass_each_kg = 10.0
panel_offset_y_m = 2.2725
prop_mass_kg = 50.0
id = 1001

[scenarios.units]
x = "orbit_index"
peri = "km"
apo = "km"

[scenarios.tolerances_quick.peri]
max_abs_km = 35.0
max_nmae = 9.00

[scenarios.tolerances_quick.apo]
max_abs_km = 15000.0
max_nmae = 3.50

[scenarios.tolerances_full.peri]
max_abs_km = 8.40
max_nmae = 9.00
max_rmse_km = 1.715

[scenarios.tolerances_full.apo]
max_abs_km = 1109.86
max_nmae = 0.55
max_rmse_km = 653.057

