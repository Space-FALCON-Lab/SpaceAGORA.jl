# Angle above the horizontal at which the plume throws the dust sheet.
version = 1

[case]
id = "apollo_dust_ejection_angle"
title = "Dust ejection angle above horizontal (CALIBRATION TARGET, never gates)"
status = "calibration_target"
gate_eligible = false
summary = """
The best-measured single number in the whole Apollo plume-surface record. The
model now produces a comparable quantity -- the mass-weighted mean ejection
angle of its grain-transport distribution -- but it is an INPUT, not a
prediction: `EjectaTransportConfig.ejection_angle_min_deg` and
`ejection_angle_max_deg` are set to the 1 to 3 degrees this very table reports,
and the distribution spreads the launches uniformly over that band. Agreement is
therefore circular and this case can never gate; it is evaluated so that the
circularity is on the record instead of being implied by a missing row.

What would make it a prediction is the crater. Immer and co-workers note in
their section 3 that on Roberts' theory the ejection angle follows the wall
slope of the scour crater, and the model now carries a crater depth profile, so
the slope is computable. Measured off that profile over the Apollo 12 descent
(see this study's README) it is 0.80 degrees on the inner wall and 0.44 degrees
on the outer, with a steepest local outer slope of 1.38 degrees; on the
tabulated field, 1.01, 0.47 and 1.60 degrees. Against a measured 1.4 to 8.1
degrees that is the right order of magnitude and at or below the bottom of the
range, so the crater could supply the angle only after its radial scale is
fixed -- its deepest point sits at 0.18 m where the reference puts it at 1 to
2 m. The angle is left as an input and the gap is reported.
"""

[source]
authors = "C. Immer, J. Lane, P. Metzger and S. Clements"
title = "Apollo Video Photogrammetry Estimation of Plume Impingement Effects"
venue = "Earth & Space 2008 (11th ASCE Aerospace Division International Conference), Long Beach, California; preprint arXiv:2104.07669"
year = 2008
locator = "Table 1, dust ejection angle for Apollo missions, derived from video photogrammetry"
doi = ""
url = "https://arxiv.org/abs/2104.07669"
access = "open (author preprint)"
note = """
Table 1 gives, per mission: Apollo 11 2.6 deg, Apollo 14 2.4 deg, Apollo 15
8.1 deg, Apollo 16 1.4 deg, Apollo 17 2.0 deg, average 3.3 deg. Apollo 12 could
not be measured because the sun angle was about 5 deg instead of the other
missions' 11 deg. The text summarizes the result as 1 to 3 degrees in general and
explains Apollo 15's outlier as a landing on an 11 deg slope; it also reports a
pre-touchdown "blow out" on Apollo 15 "likely greater than 22 degrees", from
landing straddled over a crater rim. No per-mission error bar is published; the
mission-to-mission spread on flat ground (1.4 to 2.6 deg) is the practical
uncertainty.
The angle is measured by the elongation of the footpad's shadow cast through the
partially transparent dust sheet, so it is the angular thickness of the visible
sheet, not the launch angle of an individual grain.
"""

[conditions]
body = "Moon"
engine = "Apollo LM descent propulsion system"
thrust_n = 11870.0
thrust_basis = "Apollo 11 near-hover thrust; see pfgt1_erosion_threshold_shear."
height_convention = "nozzle exit plane above the undisturbed surface; the model is probed at 5 m"

[model]
quantity = "ejection_angle_deg"
unit = "deg"

[tolerance]
kind = "none"
low = 0.0
high = 0.0
reason = """
The model's angle is bounded by a configuration field taken from this table, so
no tolerance can be argued: the case is reported with its ratio and never gates.
"""

[[reference]]
value = 2.6
derived = false
note = "Apollo 11"

[[reference]]
value = 2.4
derived = false
note = "Apollo 14"
context_only = true

[[reference]]
value = 8.1
derived = false
note = "Apollo 15, landed on an 11 deg slope"
context_only = true

[[reference]]
value = 1.4
derived = false
note = "Apollo 16"
context_only = true

[[reference]]
value = 2.0
derived = false
note = "Apollo 17"
context_only = true

[[reference]]
value = 3.3
derived = false
note = "average of the five measurable missions, as printed in Table 1"
context_only = true
