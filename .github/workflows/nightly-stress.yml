name: Nightly Stress

# Run only on a nightly schedule or on manual dispatch.  These expensive
# tests do NOT run on every pull request or push — the CI workflow covers
# the same underlying test categories for those events using the prebuilt
# cached Julia environment.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-stress:
    name: Nightly stress suite
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      JULIA_NUM_THREADS: "4"
      JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: "lts"

      # Restore the prebuilt Julia package cache.
      - uses: julia-actions/cache@v2

      # Restore the CondaPkg environment from cache.
      - name: Cache CondaPkg environment
        uses: actions/cache@v4
        with:
          path: ~/.julia/condapkg/SpaceAGORA
          key: condapkg-${{ runner.os }}-${{ hashFiles('.SpaceAGORA/CondaPkg.toml') }}
          restore-keys: condapkg-${{ runner.os }}-

      # Instantiate the project environment (uses the cache above).
      - name: Instantiate environment
        run: julia --startup-file=no --project=.SpaceAGORA -e 'using Pkg; Pkg.instantiate()'

      # Full unit test suite with code-coverage instrumentation.
      - name: Full test suite with coverage
        run: julia --startup-file=no --project=.SpaceAGORA --code-coverage=user test/runtests.jl

      # Source-load + deprecation-warning check (same check as in CI and docs,
      # but run here in the nightly context to catch regressions that might
      # only surface after a full day of commits).
      - name: Depwarn smoke
        run: |
          julia --startup-file=no --depwarn=error --project=.SpaceAGORA -e '
            include("src/physical_models/Planet_data.jl")
            include("src/config.jl")
            println("nightly_depwarn_smoke_ok")
          '

      # Threaded stress: run the same smoke under 4 threads to surface
      # any data-race regressions that are invisible on a single thread.
      - name: Threaded stress
        run: |
          julia --startup-file=no --depwarn=error --project=.SpaceAGORA -e '
            if Threads.nthreads() < 2
              error("Threaded stress requires ≥ 2 threads; got $(Threads.nthreads())")
            end
            include("src/physical_models/Planet_data.jl")
            include("src/config.jl")
            using StaticArrays
            earth = planet_data(0)
            @assert earth.μ > 0
            println("nightly_threaded_stress_ok ($(Threads.nthreads()) threads)")
          '

      # Upload any coverage data produced above so it can be inspected
      # in the Actions artifacts panel.
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: "**/*.cov"
          if-no-files-found: ignore
