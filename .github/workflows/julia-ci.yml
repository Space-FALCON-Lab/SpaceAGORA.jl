name: Julia CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11", "1.12"]
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Run test suite
        run: julia --project=.AGORA test/runtests.jl

      - name: Depwarn smoke (Earth thruster example)
        if: matrix.julia-version == '1.12'
        run: julia --depwarn=error --project=.AGORA src/examples/Earth_Thruster_Test.jl

  clean-depot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_DEPOT_PATH: ${{ runner.temp }}/julia-clean-depot
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate in clean depot
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Clean-depot student entrypoint smoke
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_clean_depot_smoke.jl

  threaded-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Threaded smoke
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_threaded_smoke.jl

  revise-hot-reload-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Revise hot-reload smoke
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_revise_hot_reload_smoke.jl

  readme-command-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: README instantiate command
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: README example command
        run: julia --startup-file=no --project=.AGORA src/examples/Earth_Thruster_Test.jl
