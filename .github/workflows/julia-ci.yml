            /usr/lib/google-cloud-sdk /usr/lib/jvm /opt/az /opt/microsoft \
            /opt/pipx /usr/share/miniconda /usr/local/share/chromium \
            /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean > /dev/null 2>&1 || true
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate vendored GRAMSuite in clean depot
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke in clean depot
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate in clean depot
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Clean-depot student entrypoint smoke
        run: julia --startup-file=no --depwarn=error --project=. test/smoke/ci_clean_depot_smoke.jl

