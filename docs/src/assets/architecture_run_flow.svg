   </g>
   <g id="text_22">
    <text style="fill: #1f3f59; font: 12px 'Arial'; text-anchor: middle" x="432" y="680.589375" transform="rotate(-0 432 680.589375)">Integrate state; apply scheduled updates, events and saving</text>
   </g>
   <g id="text_23">
    <text style="fill: #1f3f59; font: 10.5px 'Arial'; text-anchor: middle" x="432" y="707.643672" transform="rotate(-0 432 707.643672)">src/simulation/engine/ + src/simulation/callbacks/</text>
   </g>
   <g id="text_24">
    <text style="fill: #1f3f59; font: 10.5px 'Arial'" transform="translate(75.145391 596.515703)">Trial /</text>
