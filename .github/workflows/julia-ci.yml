  coverage-quality-gate:
    runs-on: ubuntu-latest
    # Instrumented runs hit 120 minutes before unit/parallel tests and the
    # coverage gate finished; retain the full workload with setup headroom.
    timeout-minutes: 150
    env:
      JULIA_NUM_THREADS: "4"
      # Coverage debt (July 2026): first real gate run measured 82.84%
      # overall; restore to 90.0 as the debt register in
      # test/gates/ci_coverage_quality_gate.jl burns down.
      # This job builds native GRAM, so skipping its native probes must fail.
      SPACEAGORA_REQUIRE_NATIVE_GRAM_PROBES: "1"
      SPACEAGORA_COVERAGE_MIN_OVERALL: "80.0"
      SPACEAGORA_COVERAGE_MIN_FILE: "80.0"
      # The window is measured back from the NEWEST .cov file (written when
      # the main suite process exits), but probe SUBPROCESSES (suites 02/09)
      # write their .cov at their own exit, up to a full suite-duration
      # earlier. 1200s silently dropped the threaded/GRAM probe coverage
      # whenever the post-probe tail of the suite outgrew 20 min, failing
      # per-file floors on files those probes cover. Must exceed the whole
      # suite step's wall time on the slowest hosted runner. Keep it at least
      # as long as this job budget so early child coverage remains included.
