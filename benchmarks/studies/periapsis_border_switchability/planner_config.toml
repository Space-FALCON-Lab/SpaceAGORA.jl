# Planner arms (WP-P2): B-ODY, ladder L0 to L3, open-loop OL and online-replanned OL-R. Plan: tasks/2026-10-15_periapsis-region-border-targeting/analytic_framework_and_transfer_plan.md,
# R4.5 to R4.10 (arms, criteria, freeze items F9 to F13), R7.3, R7.4 (OL, D6), R8.1, R8.2 (OL-R, D7). NOT FROZEN: Freeze B has not happened; every ASSUMED value below is a named field the coordinator may change before it.
# Same keys as stageg3_config.toml for the shared helpers ([stagef], [analysis], [common.*], [planets.mars.*], [stageo], [stageg3]); planner_lib.py --selftest asserts that these sections equal stageg3_config.toml's
# (the only difference is results_subdir = "planner"). The planner's own tables are [planner] and below.
# Labels: SOURCED (cited file or paper), DERIVED (computed from sourced values), ASSUMED (named choice, flagged), NUMERICAL (a numerical tolerance, not a modeling choice).
[stagef]
results_subdir = "planner"       # below the results root; per-planet folders below it
planets = ["mars"]
cell_seed = 20261019               # ASSUMED: numpy default_rng seed of the cell draw (stagef_cells.py)
n_epochs = 3                       # ASSUMED (user: >= 3 epochs / local-time sectors)
n_per_group = 4                    # ASSUMED: cells drawn per (epoch, inclination); 3 x 4 x 4 = 48 cells per planet (user: >= 20 cells)
n_dev_per_group = 2                # ASSUMED: of the 4 drawn cells per group, 2 development, 2 held out
workers = 4                        # ASSUMED, modest on the workstation
perturbation_mode = "pass"         # SPACEAGORA_GRAM_DENSITY_PERTURBATION value for the perturbed arm
perturbation_reseed = "1"          # SPACEAGORA_GRAM_DENSITY_PERTURBATION_PASS_RESEED: pass k's random stream depends only on (cell seed, k)
fixed_margin_m = 1000.0            # ASSUMED (the value used by the Stage E / Stage C closed loops): the fixed margin under test
policy = "near_passive"            # SOURCED: Stage E / C closed loops
predictor = "v5"                   # frozen estimator v5, one-pass prediction (run_mars_closedloop.jl --predictor=v5 form)


[analysis]
# Pre-registered thresholds, identical across planets (plan section 5). ASSUMED unless noted.
min_scored_passes_per_cell = 20    # a cell counts toward T2/primary only with this many scored one-pass-ahead pairs (user: >= 20 passes)
min_cells = 20
coverage_levels = [0.841, 0.95, 0.99]   # nominal one-sided coverages (Gaussian k = 1, 1.64, 2.33 in the earlier study)
coverage_tolerance_below = 0.03    # R1 passes if empirical LOCO-quantile coverage >= nominal - this
percell_tolerance = 0.10           # R2 per-cell band at 95%
percell_fraction_required = 0.70   # R2 fraction of qualifying cells inside the band
half_band_fraction = 0.5           # R3: one-sided 95% buffer <= half_band_fraction * ln(Q_hi/Q_lo)
information_ratio_max = 0.5        # R4: sigma(best)/sigma(P0s) (T4 of the earlier study)
ewma_gain_threshold = 0.05         # R5: EWMA "beats" persistence if sigma ratio <= 1 - this
generality_factor = 2.0            # R7: planets' 95% buffers in scale heights within this factor of each other
lag1_white_threshold = 0.10        # R6: |lag-1| of the random component below this counts as white
adapt_coverage = 0.95              # F2 adaptive rule: one-sided quantile level on each limit
adapt_min_band_m = 200.0           # F2: minimum width of the adaptive corridor; below it the corridor is collapsed to its predicted-median center
win_cost_tolerance = 0.10          # F2 X: adaptive may lose at most this fraction of apoapsis decay per day and add at most this fraction of dV
bootstrap_draws = 10000
bootstrap_seed = 20261020

# ------------------------------------------------------------------------------------------------------------------------------
[common.atmosphere]
fit_top_altitude_m = 400000.0       # ASSUMED (as venus_gram_config.toml)
temperature_k = 170.0               # placeholder, never used for drag

[common.atmosphere_gram]
entry_interface_km = 2000.0         # SOURCED: GRAM extension zero-density ceiling; GRAM sampled wherever it is sampled (venus_gram_config.toml)
density = "mean"

[common.band]
q_low_w_cm2 = 0.05                  # SOURCED (paper): lower corridor edge; below it = "low" tier (campaign-length cost only)
q_high_w_cm2 = 0.25                 # SOURCED (paper): upper corridor edge = soft-violation threshold; the controller's thermal edge
q_target_w_cm2 = 0.15               # SOURCED (paper): target heat rate; used as the first-pass calibration target (Stage F used the geometric mean of the band)
q_medium_w_cm2 = 0.30               # SOURCED (paper): soft tier 0.25 to 0.30, medium tier above it
q_hard_w_cm2 = 0.45                 # SOURCED (paper): medium tier 0.30 to 0.45, hard tier (mission failure) above it
w_cm2_to_w_m2 = 1.0e4

[common.guess]
fixed_point_iterations = 3          # ASSUMED (venus_gram_config.toml)
root_bracket_m = [80000.0, 300000.0]
root_tolerance_m = 1.0

[common.fit]
window_below_m = 15000.0            # ASSUMED (venus_gram_config.toml): the in-window rule of the density-buffer analysis
window_above_m = 25000.0
step_m = 1000.0
node_spacing_m = 2000.0
local_scale_height_step_m = 500.0

[common.calibration]
max_iterations = 8
q_tolerance_relative = 1.0e-3
horizon_fraction_of_period = 0.65

[common.integration]
reltol = 1.0e-9                     # SOURCED: examples/periapsis_corridor_config.toml [integration]
abstol = 1.0e-11
dt_max_orbit_s = 30.0
dt_max_atmosphere_s = 1.0
solver_mode = "tsit5"

[common.analysis]
impact_altitude_m = 50000.0         # SOURCED: IMPACT_ALTITUDE_M, event_callbacks.jl

[common.closedloop]
policy = "near_passive"
margin_m = 1000.0

# ------------------------------------------------------------------------------------------------------------------------------
[planets.mars.planet]
name = "Mars"                       # SOURCED: mars_generality_config.toml
spice_center = "MARS"
third_bodies = ["Sun"]
[planets.mars.gravity]
coefficient_file = "data/planets/gravity/Mars50c.csv"    # SOURCED: mars_generality_config_g20.toml (Mars50c truncated to degree 20, order 20; the Stage F run used degree 3, order 0)
degree = 20
order = 20
[planets.mars.orbit]
# apoapsis_radius_m is injected from [stageo].ra0_m by the loader (one source of truth); the start is at apoapsis.
true_anomaly_deg = 180.0            # ASSUMED: start at apoapsis, study convention since Stage C (plan R1.1)
[planets.mars.guess]
initial_altitude_m = 109000.0       # ASSUMED start (mars_generality_config.toml initial_periapsis_altitude_guess_m)
[planets.mars.vehicle]
bus_dims_m = [2.2, 2.6, 1.7]        # SOURCED: mars_generality_config.toml (Odyssey)
panel_dims_m = [0.01, 1.945, 1.7]
bus_mass_kg = 391.0
panel_mass_each_kg = 10.0
panel_offset_y_m = 2.2725
prop_mass_kg = 50.0
cd = 2.2
beta_override_kg_m2 = 0.0
thrust_n = 4.0
specific_impulse_s = 220.0
max_burn_delta_v_mps = 10.0
max_burn_duration_s = 1800.0
total_delta_v_budget_mps = 100.0
planning_lead_deg = 12.0
predictor_monotone_tolerance_m = 0.5
[planets.mars.grid]
# Single geometry. Element values are in [stageo]; epochs_utc is kept because the shared helpers index it.
epochs_utc = ["2001-11-06T19:00:32"]   # SOURCED: odyssey_tolson.toml [scenarios.initial_time]; taken as the time of the starting apoapsis (ASSUMED, plan R1.1: shifts the clock by about half an orbit)
horizon_days = 90.0                 # unused by Stage O (each case carries its own horizon from [stageo.arms]); kept for the shared helpers

[stageo]
# Only what stageo_load / the shared helpers read. The start orbit's inclination, RAAN and omega come from the geometry table (config [stageg3.table]), the epoch from the table (checked against base_epoch_utc + epoch_off_d).
ra0_m = 28533000.0                  # SOURCED: Smith and Bell 2005 via Falcone and Putnam 2023 Table III, main phase 1 start (stageo_config.toml)
ra_target_m = 7408000.0             # SOURCED: Table III, end of main phase 2; a flight stops at the first apoapsis at or below it
cal_gram_tag = "ODY_cal"            # ASSUMED (as stageo): seed string tag of the fit-only calibration cases (mean density, perturbation off)
smoke_days = 3.0                    # ASSUMED (as stageo): length of the smoke flights
solver_maxiters = 20000000          # ASSUMED (as stageo): generous step limit, a safety limit not a tuned value
peak_gate_altitude_m = 500000.0     # ASSUMED (as stageo): density is sampled for the per-pass peak only below this altitude
track_vrel = false                  # unused here (the gate's own decision_speed below replaces it); the key is kept because stageo_load's callers read the [stageo] table

[stageo.bands.odyssey]
q_low_w_cm2 = 0.14                  # SOURCED: Hanna p. 3, Fig. 5; Takashima p. 3; Tartabini p. 11 (stageo_config.toml)
q_high_w_cm2 = 0.32                 # SOURCED: same
q_target_w_cm2 = 0.212              # DERIVED: geometric mean sqrt(0.14 x 0.32) (Stage F rule)
q_medium_w_cm2 = 0.54               # SOURCED: flight allowable (175 C), Hanna p. 3
q_hard_w_cm2 = 0.54                 # SOURCED: plan section 3 hard (failure) 0.54
q_qualification_w_cm2 = 0.65        # SOURCED: Hanna p. 3 (195 C); reported tier only
w_cm2_to_w_m2 = 1.0e4

[stageg3]
base_epoch_utc = "2001-11-06T19:00:32"   # SOURCED: odyssey_tolson.toml (stageo_config.toml [planets.mars.grid] epochs_utc); the starting apoapsis (ASSUMED there). Geometry epochs are this plus epoch_off_d
band = "odyssey"                    # SOURCED: R4.3 flies the Stage O F-O keeper (Odyssey band 0.14 to 0.32 W/cm2)
keeper_margin_m = 1000.0            # SOURCED: Stage O fixed keeper margin (stageo_config.toml [stageo.n2] fixed_margin_m)
horizon_days = 130.0                # ASSUMED (as Stage O F-O): horizon limit only; a flight stops at the first apoapsis at or below ra_target_m
burn_response_ratio = 1.0           # DERIVED (halflever_twin_results.md, R4.1): GRAM-on twin test; the named field of every config (F2). Used by the analysis lever weights and the burn reconstruction
decision_speed = "relative"         # U15 (R5.1, CONFIRMED): the keeper's decision quantity is the atmosphere-relative speed at the osculating periapsis. "first_pass" = the first-pass relative speed held fixed (Stage O track_vrel = false)
seeds = [101, 102]                  # ASSUMED: GRAM seeds of the gate flights, outside the dev (1 to 12 of Stage O; 1 to 8 of the held-study dev) and held (13 to 28) seed sets so the gate never reuses a study seed
seed_tag_prefix = "G3s"             # ASSUMED: GRAM seed string = "mars" * prefix * k through the FNV stagef_seed; the same seed string is used by the keeper and the zero-burn flight of one geometry (paired perturbations)
workers = 4                         # ASSUMED (R4.3: 4 workers, MemoryMax 24G, host quiet)
keeper_seeds_per_geometry = 2       # R4.3
zero_burn_roles = ["G1", "G2"]      # R4.3: zero-burn flights at G1 and G2 only
zero_burn_seeds = 2                 # R4.3: 2 zero-burn flights each
smoke_forced_safety_q_w_cm2 = 0.01  # ASSUMED: the smoke flight lowers the Q safety threshold to this value so the terminate path fires on pass 1 (F4: safety terminate tested on a smoke flight). Never used by a gate flight

[stageg3.safety]
# Zero-burn safety stop (R4.3, U19, CONFIRMED but ASSUMED values): terminate at the closing apoapsis of a pass whose maximum Q_s on V_rel exceeds q_stop, or at a periapsis whose geodetic altitude is
# more than n_hloc x H_local below the first-pass periapsis altitude (the calibrated start). H_local = hloc_at_hg_m of the geometry's calibration (guess.csv).
q_stop_w_cm2 = 0.65                 # ASSUMED (U19); numerically the Odyssey qualification limit (SOURCED Hanna p. 3)
n_hloc = 3.0                        # ASSUMED (U19)

[stageg3.rotation]
w_rot_rad_s = 7.08823596e-5         # SOURCED: planets.jl Mars struct (geometry_rank_config.toml [mars] w_rot_rad_s). Used ONLY by the selftest's identity checks; flights use planet.ω of the engine
mu_m3s2 = 42828.375e9               # SOURCED: stageo_analysis.py MU (R1.2); selftest and the inertial Q_s form only

[stageg3.criteria]
# V-G pass criteria (R4.3, U19 CONFIRMED; the numbers are ASSUMED values). Frozen at Freeze A with the code.
smooth_passes = 15                  # SOURCED: geometry_rank_config.toml [band] fast_window_passes (the 15-pass smoothing of R4.3 (a))
min_correlation = 0.85              # ASSUMED (U19)
range_factor = 1.5                  # ASSUMED (U19)
range_abs_ln = 0.15                 # ASSUMED (U19): absolute alternative when both ranges are below W_eff
floor_abs_mps = 0.3                 # ASSUMED (U19)
floor_rel = 0.30                    # ASSUMED (U19)
min_passes_scored = 30              # ASSUMED: a flight with fewer flown passes is reported INSUFFICIENT (not scored, counts as not passed); the 15-pass smoothing needs a few windows
flights_rule = "all"                # ASSUMED: a geometry passes only if every scored flight of it passes (keeper and zero-burn); R4.3 does not say how seeds combine. Stricter than a mean
meanfield_dir = "analytic_data/meanfield_fine"   # DERIVED: GRAM mean-field samples of the 8,064-candidate ranking (mf_*.csv, keyed by the geometry id = field_id); relative to the task directory. Missing = the prediction runs without the field and says so
meanfield_dir_fallback = "analytic_data/meanfield"   # DERIVED: the earlier cut-256 samples (ids of that grid); used only if an id is not found in meanfield_dir

# Geometry candidates (R4.3): FINAL table from the coordinator's file geometry_gate_table.json (selected by the user-confirmed defaults from the 8,064-candidate jitter-ensemble ranking, Sun channel from the engine-sourced table).
# The elements, epochs, roles and ids are READ FROM THAT FILE at load (Julia and Python); this config stores only its location and sha256, and loading ERRORS on a hash mismatch. The elements are DERIVED (ranking); ids are labels.
[stageg3.table]
path = "geometry_gate_table.json"   # relative to the task directory tasks/2026-10-15_periapsis-region-border-targeting (found by walking up from this file; env SPACEAGORA_BORDER_TASK_DIR overrides)
sha256 = "ac02be4d9be0a88ba1051444b13bf19717f5f854fb763a87dec71f5895908fc8"   # SOURCED: geometry_gate_table.json.sha256 (coordinator, 2026-10-26)
include_g3 = false                  # the table's optional G3 (G8020, 160 deg, best overall) is listed but not flown by default; true adds 2 keeper flights for it (no zero-burn)

[stageg3.plan_counts]
# R4.3 flight list, as written in the plan (the dry run is checked against these): 6 keeper flights + 4 zero-burn flights.
keeper = 6
zero_burn = 4
gate = 10
cal_cases = 3                       # one fit-only calibration case per geometry (default set) (not flights)
smoke = 2                           # one forced-stop zero-burn flight at G1 plus one keeper padding flight (a one-case campaign plans route none); outside the 10

# ==============================================================================================================================
# Planner tables
# ==============================================================================================================================
[planner]
burn_response_ratio = 1.0           # DERIVED (halflever_twin_results.md, R4.1): named field; equals [stageg3] burn_response_ratio (selftest asserts)
q_cap_mean_w_cm2 = 0.2503            # DERIVED (calibration, Revision 12 workflow): R1.2 cap at E = 0.5 for sigma_p 0.0452, interpolated from the plan's own table (caps 0.255, 0.234, 0.213 at sigma_p 0, 0.10, 0.15): ln(0.54/q) = f(0) + 3.446 (sqrt(0.188^2 + sigma_p^2) - 0.188); this form reproduces the 0.15 entry to 0.1%. Was 0.234 at the ASSUMED sigma_p 0.10
E_budget = 0.5                      # SOURCED (R4.5 settings): expected number of passes above q_exceed_ref per campaign (the knee)
sigma_p = 0.0452                    # MEASURED (dev seeds 1 to 8, planner_calibration.py: pooled sd of the one-pass prediction error of ln q_mean, 8 flights x 4 arms). Was ASSUMED 0.10 (U14)
q_exceed_ref_w_cm2 = 0.54           # SOURCED: flight allowable, Hanna p. 3 (the exceedance counted against E)
q_never_exceed_qs_w_cm2 = 0.65      # ASSUMED USE of a SOURCED value (U12, flagged): pass-maximum Q_s on V_rel above this terminates the flight (terminal check, F10). Value SOURCED: qualification limit, Hanna p. 3
slack_band_factor = 2.0             # ASSUMED reading of plan R1.3 (geometry_rank_config.toml [band]): tube width W = factor x ln(q_cap / q_req); W is read from the ground table (per geometry)
fast_reserve_ln = 0.257             # DERIVED (plan R3.2; geometry_rank_config.toml fast_width_ln_at_ratio_1): 5-95% width of the fast part of the path; half is kept free at each tube edge for planned steps beyond the next pass
l0_width_ln = 0.6202                # DERIVED: N2's band-width cap w_cap_m = 4000 m (SOURCED stageo_config.toml [stageo.n2]) / h_fallback_m = 6450 m (DERIVED, geometry_rank_config.toml [decay]); ASSUMED reading of R2.2 "N2-I's planned band at E 0.5"
d_ref_days = 70.4                   # MEASURED (dev seeds 1 to 8): median over seeds of min(B-ODY, F-O dev); F-O dev flights (Stage O seeds 1 to 8) are all slower, so it is the B-ODY dev median 70.40 d. Planning value only (sets q_req in the ground table); C1 is scored per seed on held (U13). Was DERIVED 64.2 d
h_local_fallback_m = 6450.0         # DERIVED (geometry_rank_config.toml [decay] h_fallback_m): scale height of the lever weights when a ground table has no mean-field H
tail_passes = 50                    # ASSUMED guard: plan steps beyond the ground table's last pass hold the last increments (zero) and weights; a flight may outlast the model campaign (it ran 4 to 5% long in the ranking selftest)
seed_tag_prefix = "ODY_s"           # SOURCED (stageo_config.toml [stageo] seed_prefix): GRAM seed string = "mars" * prefix * k, the SAME string as the baselines' so perturbation streams pair across arms
dev_seeds = [1, 8]                  # SOURCED (R4.5): dev seeds 1 to 8
held_seeds = [13, 28]               # SOURCED (R4.5): held seeds 13 to 28 (16)
horizon_days = 130.0                # ASSUMED (as stageo F-O): horizon limit only; a flight stops at the first apoapsis at or below ra_target_m
smoke_days = 3.0                    # SOURCED (R1.4): smoke flights are 3 d
smoke_seeds = [1, 2]                # ASSUMED (F12: 2 seeds): dev seeds
repro_seeds = [13, 14]              # ASSUMED (R1.4: repro 2): the first two held seeds of L3 at G1, flown a second time
xhost_seed = 13                     # ASSUMED (F13): first held seed of L3 at G1, flown on both hosts
workers = 4                         # ASSUMED, modest on the workstation (R4.9: 4 workers, MemoryMax 24G; sf3 at most 3 workers, 16G)

[planner.calibration]
# Calibration freeze (U13, U14; calibration_freeze.md): the three values above (sigma_p, d_ref_days, q_cap_mean_w_cm2) replaced the placeholders after the dev flights. No code or logic changed for this, except that
# planner_predictions.py applies q_cap_mean_w_cm2 and d_ref_days to the ranking context in memory instead of asserting equality with the frozen geometry_rank_config.toml.
old_sigma_p = 0.10
old_d_ref_days = 64.2
old_q_cap_mean_w_cm2 = 0.234
dev_seeds = [1, 8]

[planner.dp]
# The exact dynamic program (planner_lib.dp_plan / planner_common.jl planner_dp): minimize sum_m L_m |nu_m - nu_{m-1}| over cumulative ln-q offsets nu_m inside [A_m, B_m] (superposition: a burn shifts the whole later path).
tie_eps = 1.0e-6                    # NUMERICAL: weights L_m (1 + tie_eps (n - m) / n) make an early burn slightly dearer than the same burn later (lazy tie-break; no effect on the objective beyond 1e-6 relative)
min_burn_mps = 0.001                # ASSUMED (numerical): a planned burn below this is not commanded (dust of the tie-break); the executed offset bookkeeping uses what was commanded
tol = 1.0e-9                        # NUMERICAL: feasibility tolerance of the offset bounds
burn_penalty_mps = 0.01             # ASSUMED (user decision 2026-10-27, held-run default): fixed dV-equivalent cost per burn in the DP, taken from ONE noise-free model replay (planner_predictions.json burn_penalty_sensitivity: OL-R 8 burns at 2.06 m/s and OL 7 burns at 1.98 m/s at Odyssey, against 120 and 116 burns with 0). Not tuned on flights. Arms L3Z and OLRZ (penalty 0) are the sensitivity arms

[planner.update]
# OL-R drift-path update (R8.1: the estimator and the update rule are the planner's own; no meta-learning). Residual r_i = realized ln q_mean,i - (ground-table path_i + executed burn offset_i); the slope of r over the last `window` passes
# (least squares) is added to the table's slow increments for the next `cap_passes` planned steps, times `gain`.
window = 15                         # SOURCED value (geometry_rank_config.toml fast_window_passes), ASSUMED use as the update window
gain = 1.0                          # ASSUMED (named field; dev may tune it before Freeze B)
cap_passes = 15                     # ASSUMED: the update acts on the next 15 planned steps only (a slope fitted on 15 noisy residuals is not extrapolated across the campaign)

[planner.body]
# B-ODY (plan section 7, U10): the Odyssey operating posture inside our truth.
q_low_qs_w_cm2 = 0.14               # SOURCED: Odyssey corridor, Hanna p. 3, Fig. 5; Takashima p. 3; Tartabini p. 11
q_high_qs_w_cm2 = 0.32              # SOURCED: same
q_target_mp1_qs_w_cm2 = 0.24        # SOURCED: Table III phase median, MP1 (plan section 7)
q_target_mp2_qs_w_cm2 = 0.20        # SOURCED: Table III phase median, MP2
qs_over_qmean = 1.372               # DERIVED (plan R1.1): mean of Q_s / q_mean (pass maximum over the mean-field heat rate at the event); converts the Q_s band to the planner's mean-field coordinate
cadence_s = 86400.0                 # SOURCED: at most one burn per 24 h (Tartabini p. 7-8)
mp1_passes_flown = 108              # SOURCED: Table III main phase 1 passes (stageo_config.toml [stageo.flown] comment)
total_passes_flown = 153            # SOURCED: Table III passes P19-171
total_passes_ref = 200              # DERIVED (plan R1.2): B-ODY flies about 200 passes in our truth
mp1_last_pass = 141                 # DERIVED: round(108 / 153 x 200). ASSUMED mapping of Odyssey's MP1/MP2 split onto our pass count (the B-ODY target switches from the MP1 to the MP2 value after this pass)

[planner.safety]
# Safety stop (reuses stageg3_common.jl SafetyStop). "q": pass-maximum Q_s on V_rel above q_never_exceed terminates at the closing apoapsis. "q_alt": additionally a periapsis more than n_hloc x H_local below the first-pass altitude (the zero-burn rule, U19).
n_hloc = 3.0                        # ASSUMED (U19, confirmed by the user)

# Arms. mode: body | online | ol | olr. slack: tube of width W (ground table) with the fast reserve, else the L0 band of width l0_width_ln. ff: drift feed-forward from the ground table (else persistence of the one-pass prediction).
# early: true lever weights of the table (the DP sees the shrinking lever, so it prepays), else the current lever for every step (lazy). update: OL-R drift update. horizon: planned passes (0 = to the end of the table + tail).
[planner.arms.BODY]
mode = "body"
slack = false
ff = false
early = false
update = false
horizon = 0
safety = "q"
runner = "planner"
host_default = "ws"
note = "Odyssey-style emulation (U10): Q_s band 0.14 to 0.32, targets 0.24 MP1 / 0.20 MP2, one burn per 24 h"
[planner.arms.L0]
mode = "online"
slack = false
ff = false
early = false
update = false
horizon = 1
safety = "q"
runner = "planner"
host_default = "ws"
note = "R2.2 L0: planner reset-to-edge rule, no slack (band of width l0_width_ln), no feed-forward, no prepayment"
[planner.arms.L1]
mode = "online"
slack = true
ff = false
early = false
update = false
horizon = 1
safety = "q"
runner = "planner"
host_default = "ws"
note = "L1: slack band, zero drift beyond the one-pass prediction"
[planner.arms.L2]
mode = "online"
slack = true
ff = true
early = false
update = false
horizon = 30                        # ASSUMED (named): planned passes of the online ladder arms
safety = "q"
runner = "planner"
host_default = "ws"
note = "L2: slack + drift feed-forward (ground table), current lever for every step (no prepayment)"
[planner.arms.L3]
mode = "online"
slack = true
ff = true
early = true
update = false
horizon = 30
safety = "q"
runner = "planner"
host_default = "ws"
note = "L3: full planner; true lever weights so the DP prepays while the lever is large"
[planner.arms.OL]
mode = "ol"
slack = true
