name: Julia CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

# One live run per pull request (or per branch on push): a new push cancels
# the stale run of the same PR instead of competing with it for runners.
concurrency:
  group: julia-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-matrix:
    runs-on: ubuntu-latest
    # Includes dependency setup, the full suite and Earth thruster smoke.
    # PR151 reached 120 minutes after its standalone unit suite passed;
    # reserve time for the remaining suite and cold dependency compilation.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.12"]
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          # Jobs have crashed with ENOSPC mid-run (the runner worker dies
          # writing its own logs, so the step never even reports a failure —
          # seen on coverage-quality-gate for main@8e7be423 and PR #35).
          # Reclaim aggressively: none of these preinstalled toolchains are
          # used by Julia CI.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk /usr/lib/jvm /opt/az /opt/microsoft \
            /opt/pipx /usr/share/miniconda /usr/local/share/chromium \
            /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean > /dev/null 2>&1 || true
          df -h /

      - name: Pinned GRAMSuite retrieval regression
        run: python3 test/scripts/test_gramsuite_retrieval.py

      - name: Load pinned dev GRAMSuite revision
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Prepare grid adapter test environment
        run: julia --startup-file=no test/grid_atmosphere/setup.jl

      - name: Native-free GRAM grid adapter
        timeout-minutes: 15
        run: julia --startup-file=no --project=test/grid_atmosphere test/grid_atmosphere/runtests.jl

      - name: Run test suite
        run: julia --startup-file=no --project=. test/runtests.jl

      - name: Depwarn smoke (Earth thruster example)
        if: matrix.julia-version == '1.12'
        run: julia --startup-file=no --compiled-modules=existing --depwarn=error --project=. examples/Earth_Thruster_Test.jl

  tests:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - tests-matrix
    steps:
      - name: Enforce test matrix success
        run: |
          echo "tests-matrix result=${{ needs.tests-matrix.result }}"
          if [ "${{ needs.tests-matrix.result }}" != "success" ]; then
            echo "Test matrix failed or was cancelled."
            exit 1
          fi

  clean-depot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      # The runner context is not available in job-level env, and GitHub
      # rejects the whole workflow file when it is used there. Export the
      # clean depot path from a step instead.
      - name: Use a clean Julia depot
