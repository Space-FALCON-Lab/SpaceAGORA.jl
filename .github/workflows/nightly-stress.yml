name: Nightly Stress

on:
  schedule:
    - cron: "0 7 * * *"
  # On pull requests this heavy tier (the full-profile telemetry regression,
  # one job per scenario, plus the stress and contract suites) auto-triggers
  # only when the change can move the spacecraft or change the grading.
  # Everything else gets the fast tier (Julia CI) and the nightly run on main
  # stands guard. The coverage-instrumented test suites are NOT repeated here:
  # Julia CI runs them on every PR and on every push to main.
  pull_request:
    paths:
      - "src/dynamics/**"
      - "src/environment/**"
      - "src/simulation/**"
      - "src/core/**"
      - "src/gnc/**"
      - "src/vehicle/**"
      - "src/mission/**"
      - "src/parallel/**"
      - "src/analysis/verification/**"
      - "ext/**"
      - "data/GRAMSuite.jl"
      - "data/telemetry/**"
      - "data/Gravity_harmonics_data/**"
      - "test/telemetry_benchmark_manifest.toml"
      - "test/stress/**"
      - "benchmarks/studies/telemetry_orbit_accuracy_study.jl"
      - "Project.toml"
      - "Manifest.toml"
      - ".github/workflows/nightly-stress.yml"
  workflow_dispatch:

# One live run per pull request (or per branch for schedule/push): a new
# push cancels the stale run of the same PR instead of competing with it.
concurrency:
  group: nightly-stress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Everything the PR tier does not already run, minus the telemetry regression
  # (which has its own matrix job below so the three scenarios run in parallel).
  nightly-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Fetch base ref (PR only)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Contract suite
        run: julia --startup-file=no --project=. test/contracts/nightly_runtests.jl

      - name: AI review artifact gate (PR only)
        if: github.event_name == 'pull_request'
        env:
          SPACEAGORA_PR_NUMBER: ${{ github.event.pull_request.number }}
          SPACEAGORA_BASE_REF: ${{ github.base_ref }}
        run: julia --startup-file=no --project=. test/gates/ci_ai_review_artifact_gate.jl

      - name: Threaded smoke stress
        run: julia --startup-file=no --depwarn=error --project=. test/smoke/ci_threaded_smoke.jl

      - name: Example regression stress
        run: julia --startup-file=no --depwarn=error --project=. test/integration/examples/runtests.jl

      - name: Stress suite
        run: julia --startup-file=no --depwarn=error --heap-size-hint=10G --project=. test/stress/runtests.jl

  # Full-profile telemetry regression, one runner per scenario. Each job is
  # about a quarter of the old single step: the scenarios no longer queue
  # behind each other, and the Odyssey scenario no longer solves twice (the
  # runner reuses the calibration eval solve when the grid has one point).
  telemetry-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        scenario: [odyssey, vex, earth_gmat]
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Fetch base ref (PR only)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      # --heap-size-hint keeps Julia's GC high-water mark under the hosted
      # runner's physical memory (public-repo ubuntu-latest: 4 vCPU/16 GB):
      # without it this step intermittently starves the runner agent and the
      # job dies mid-step. 10G leaves room for native GRAM and the OS.
      # Effector-level threading off for the graded regression: with it on, two
      # solves of the same Odyssey scenario in one process differ bit-for-bit on
      # the 4-vCPU runners (the automatic policy re-decides the execution path
      # every step from a wall-clock cost estimate). With it off the solves are
      # identical on the same runner. See branch experiment/odyssey-determinism.
      - name: Telemetry full regression (${{ matrix.scenario }})
        env:
          SPACEAGORA_EFFECTOR_PARALLEL: "off"
        run: >-
          julia --startup-file=no --depwarn=error --heap-size-hint=10G --project=.
          benchmarks/studies/telemetry_orbit_accuracy_study.jl full --enforce=true
          --scenarios=${{ matrix.scenario }}
          --out-summary=output/telemetry_${{ matrix.scenario }}_summary.csv
          --out-errors=output/telemetry_${{ matrix.scenario }}_errors.csv

      - name: Upload telemetry nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-full-${{ matrix.scenario }}-${{ github.run_id }}
          path: |
            output/telemetry_${{ matrix.scenario }}_summary.csv
            output/telemetry_${{ matrix.scenario }}_errors.csv
          if-no-files-found: warn
