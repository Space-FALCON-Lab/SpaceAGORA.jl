<title id="figure-title">SpaceAGORA within a mission autonomy workflow</title><desc id="figure-desc">Mission design provides scenarios to the implemented simulator and proposed autonomy layer. Autonomy sends actions and receives observations. The simulator contains multicomponent spacecraft, GNC and physical propagation. Validation is implemented through individual checks; human oversight, learning and operational integration are proposed common connections.</desc>
