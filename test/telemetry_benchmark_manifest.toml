[scenarios.atmosphere_truth]
assumption_id = "odyssey_tabulated_flight_v1"
atmosphere_model = "tabulated_flight"
atmosphere_dataset = "Odyssey accelerometer per-pass density profiles (PDS odya_0001, Tolson)"
space_weather_model = "measured (flight)"
solar_flux_model = "measured (flight)"
# DIGITAL-TWIN REGRESSION SENTINEL (PI decision, 2026-07): the nightly flies
# on the flight-measured densities so the residual is the smallest achievable
# (dynamics + aero + replay + grading only) and the thresholds can sit at the
# measured-uncertainty envelope. Any meaningful change to the simulator then
# fails the gate, which is this scenario's job. The predictive-atmosphere
# result (MarsGRAM TES Mapping Year 2, selected by a 2,938-point measurement
# comparison) is the documented capability study in the lab notes and is not
# enforced nightly. Altitudes in the table are in the sim spheroid convention;
# sigma column drives the certification envelope (nominal here).
tabulated_flight_file = "data/telemetry/Odyssey/odyssey_accelerometer_density.feather"
tabulated_flight_sigma = 0.0

[scenarios.calibration]
enabled = true
profiles = ["full"]
search_on_quick_subset = false
fit_cd_scale = false
cd_scale_min = 1.0
cd_scale_max = 1.0
cd_scale_steps = 3
fit_cr = false
# Cr pinned at the scenario nominal: with geometry, registration, replay, and
# the atmosphere all independently validated, the Cr search selected different
# grid endpoints on near-identical inputs (residual absorption, not
# measurement) and tripled the scenario cost. The datum-bias estimator and its
# saturation alarm are retained.
cr_min = 1.15
cr_max = 1.45
cr_steps = 3
fit_bias = true
bias_abs_max_km = 500.0
objective = "mean_nmae"

[scenarios.initial_time]
year = 2001
month = 11
day = 6
hour = 19
minute = 0
second = 32.0

[scenarios.spacecraft]
bus_dims_m = [2.2, 2.6, 1.7]
panel_dims_m = [0.01, 1.945, 1.7]
bus_mass_kg = 391.0
panel_mass_each_kg = 10.0
panel_offset_y_m = 2.2725
prop_mass_kg = 50.0
id = 1001

[scenarios.units]
x = "orbit_index"
peri = "km"
apo = "km"

[scenarios.tolerances_quick.peri]
max_abs_km = 35.0
max_nmae = 9.00

[scenarios.tolerances_quick.apo]
max_abs_km = 15000.0
max_nmae = 3.50

# Limits recalibrated 2026-07 against the kernel-truth baseline (TES MY25,
# pinned Cr, walk-out replay): ~1.35x headroom over the confirmed run — the
# scale of the atmosphere-measurement uncertainty established by the
# tabulated-flight certification envelope. nmae limits tightened from their
# legacy values to stay meaningful.
# Digital-twin sentinel thresholds: ~2x the baseline run of this exact
# configuration (measured atmosphere, kernel truth). Tight by design — the
# scenario exists to catch regressions in dynamics, aerodynamics, replay, or
# grading, and the atmosphere contributes only measurement noise here.
[scenarios.tolerances_full.peri]
max_abs_km = 27.0
max_nmae = 0.27
max_rmse_km = 12.0

# The apo worst-point metric is platform-sensitive: adaptive stepping in the
# drag corridor amplifies CPU-architecture float differences into end-region
# trajectory divergence (measured: mission time -13%, max_abs 3x between
# arm64 and CI x86_64 on identical code/data), while mae/nmae stay stable to
# ~1.5% and rmse to ~30%. The relative metrics are therefore the regression
# signals; max_abs is a coarse envelope over both platforms.
[scenarios.tolerances_full.apo]
max_abs_km = 1400.0
max_nmae = 0.015
max_rmse_km = 400.0

