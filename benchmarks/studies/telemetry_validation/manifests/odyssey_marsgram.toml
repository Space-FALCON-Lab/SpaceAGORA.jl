# MarsGRAM comparator: the Mars Odyssey campaign with the Tolson density
# replaced by the TES Mapping Year 2 MarsGRAM climatology while retaining the
# remainder of the benchmark-of-record configuration
# (docs/spaceagora_aerobraking_reconstruction_record.md, §3 and §6).
#
# Context run, not a gate: it quantifies what restoring the selected
# climatology does to the same simulator chain. It is not blind MarsGRAM
# validation — the TES atmosphere family was selected using Odyssey density
# data from the same campaign. Record-of-truth values (full profile, Apple
# arm64; runtime ~4.3-5.8 h):
#   apoapsis  MAE 1399.52 km, RMSE 1757.47 km, max 3445.60 km, nMAE 0.05745
#   periapsis MAE    2.53 km, RMSE    3.17 km, max    9.78 km
#   total drag-decay ratio 0.840; alignments: apo -153.010 km, peri -9.857 km
version = 1

[[scenarios]]
name = "odyssey_marsgram"
kind = "orbit_events"
planet = "mars"
events = ["peri", "apo"]
telemetry_peri = "data/telemetry/Odyssey/True_Odyssey_periapsis_alts_kernel.feather"
telemetry_apo = "data/telemetry/Odyssey/True_Odyssey_apoapsis_alts_kernel.feather"
target_orbits_quick = 8
target_orbits_full = 340
compare_points_quick = 8
compare_points_full = 273
min_eval_points = 6
initial_state_j2000_m = [-1055155.262605, -4333732.239384, -728177.837002, -2371.221148294, -764.635541703, -3175.141365850]
ra_m = 2.8559615e7
rp_altitude_m = 91000.0
i_deg = 93.522
aop_deg = 109.7454
raan_deg = 28.1517
ta_deg = 175.0
element_frame = "body_equator_inertial"
epoch_orbit_offset = 19.0
gravity_model = "inverse_squared"
gravity_harmonics_degree = 20
gravity_harmonics_order = 20
gravity_harmonics_file = "data/Gravity_harmonics_data/Mars50c.csv"
nbody_bodies = ["sun", "earth", "moon", "jupiter"]
srp_enabled = true
srp_cr = 1.3
srp_area_m2 = 3.74
include_wind = true
orbit_altitude_mode = "true"
EI_km = 250.0

[scenarios.maneuvers]
orbit_numbers = [7, 10, 12, 14, 16, 25, 32, 45, 49, 53, 66, 74, 88, 91, 99, 105, 129, 146, 179, 197, 213, 229, 241, 257, 270, 282, 295, 306, 318, 330, 336]
delta_v_mps = [-0.549, -0.549, -0.301, -0.151, -0.303, 0.145, -0.151, -0.099, -0.099, -0.2, -0.2, 0.297, -0.149, -0.149, -0.147, 0.144, 0.144, 1.0, 0.844, 0.6, 0.844, 0.6, 0.6, 1.2, 1.0, 1.2, 1.2, 1.0, 1.0, 1.2, 19.82]
orbit_number_offset = 18
thrust_n = 4.0
isp_s = 220.0
guidance_rate_s = 30.0
control_rate_s = 10.0

[scenarios.atmosphere_truth]
# Record §3: "TES Mapping Year 2 climatology, deterministic settings, seed
# 1001, perturbations disabled, live point queries, and winds enabled."
# mars_map_year = 2 selects the TES Mapping Year 2 (MY25) climatology;
# gram_offline_surrogate = "off" pins the run to native point queries (a
# missing native library must fail loudly, not silently degrade).
assumption_id = "odyssey_marsgram_tes_my2_v1"
atmosphere_model = "GRAM"
atmosphere_dataset = "MarsGRAM TES Mapping Year 2 (MY25) climatology"
space_weather_model = "MarsGRAM deterministic (seeded, perturbations off)"
solar_flux_model = "MarsGRAM epoch-fixed defaults"
gram_seed = 1001
gram_perturbation_scales = [0.0, 0.0, 0.0, 0.0]
gram_offline_surrogate = "off"
gram_static_grid = false
gram_track_cache = false
gram_global_lock = "on"
mars_map_year = 2

[scenarios.calibration]
# Identical to the benchmark of record: Cr pinned 1.3, Cd scale pinned 1.0,
# constant event alignments only (first-10-error median, +-500 km cap). The
# recorded apoapsis alignment for this comparator is -153.010 km — inside the
# cap, so it is applied, and its size relative to the Tolson run's -15.422 km
# is itself part of the climatology-mismatch evidence.
enabled = true
profiles = ["full"]
search_on_quick_subset = false
fit_cd_scale = false
cd_scale_min = 1.0
cd_scale_max = 1.0
cd_scale_steps = 3
fit_cr = false
cr_min = 1.15
cr_max = 1.45
cr_steps = 3
fit_bias = true
bias_abs_max_km = 500.0
objective = "mean_nmae"

[scenarios.initial_time]
year = 2001
month = 11
day = 6
hour = 19
minute = 0
second = 32.0

[scenarios.spacecraft]
bus_dims_m = [2.2, 2.6, 1.7]
panel_dims_m = [0.01, 1.945, 1.7]
bus_mass_kg = 391.0
panel_mass_each_kg = 10.0
panel_offset_y_m = 2.2725
prop_mass_kg = 50.0
id = 1001

[scenarios.units]
x = "orbit_index"
peri = "km"
apo = "km"

[scenarios.tolerances_quick.peri]
max_abs_km = 35.0
max_nmae = 9.00

[scenarios.tolerances_quick.apo]
max_abs_km = 15000.0
max_nmae = 3.50

# Comparator envelopes: ~1.5x the recorded climatology-mismatch values above
# (not the tight digital-twin sentinel limits — the apoapsis discrepancy IS
# the result being recorded here). max_abs carries extra platform headroom
# for the same reason as the Tolson scenario.
[scenarios.tolerances_full.peri]
max_abs_km = 20.0
max_nmae = 0.30
max_rmse_km = 6.5

[scenarios.tolerances_full.apo]
max_abs_km = 5200.0
max_nmae = 0.09
max_rmse_km = 2650.0
