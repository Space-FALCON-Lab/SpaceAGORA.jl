name: Julia CI

on:
  push:
  pull_request:

jobs:
  tests-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1.11", "1.12"]
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Run test suite
        run: julia --project=.AGORA test/runtests.jl

      - name: Depwarn smoke (Earth thruster example)
        if: matrix.julia-version == '1.12'
        run: julia --compiled-modules=existing --depwarn=error --project=.AGORA examples/Earth_Thruster_Test.jl

  tests:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - tests-matrix
    steps:
      - name: Enforce test matrix success
        run: |
          echo "tests-matrix result=${{ needs.tests-matrix.result }}"
          if [ "${{ needs.tests-matrix.result }}" != "success" ]; then
            echo "Test matrix failed or was cancelled."
            exit 1
          fi

  clean-depot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_DEPOT_PATH: ${{ runner.temp }}/julia-clean-depot
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate in clean depot
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Clean-depot student entrypoint smoke
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_clean_depot_smoke.jl

  threaded-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Threaded smoke
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_threaded_smoke.jl

  revise-hot-reload-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Revise hot-reload smoke
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_revise_hot_reload_smoke.jl

  readme-command-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: README instantiate command
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: README example command
        run: julia --startup-file=no --compiled-modules=existing --project=.AGORA examples/Earth_Thruster_Test.jl

  example-suite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Example suite smoke
        run: julia --startup-file=no --project=.AGORA test/ci_examples_suite_smoke.jl

  example-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Example regression
        run: julia --startup-file=no --project=.AGORA test/ci_examples_regression.jl

  telemetry-quick-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Telemetry quick regression (GRAM deterministic)
        run: julia --startup-file=no --depwarn=error --project=.AGORA benchmarks/studies/telemetry_orbit_accuracy_study.jl quick --enforce=true

      - name: Upload telemetry quick artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-quick-${{ github.run_id }}
          path: |
            output/telemetry_orbit_accuracy_summary.csv
            output/telemetry_orbit_accuracy_errors.csv
          if-no-files-found: warn

  coverage-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: "2"
      SPACEAGORA_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_COVERAGE_MIN_FILE: "80.0"
      SPACEAGORA_COVERAGE_WINDOW_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests with coverage
        run: julia --startup-file=no --project=.AGORA --code-coverage=user test/runtests.jl

      - name: Coverage quality gate
        run: julia --startup-file=no --project=.AGORA test/ci_coverage_quality_gate.jl

  calibration-coverage-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
      SPACEAGORA_CAL_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_CAL_COVERAGE_MIN_FILE: "70.0"
      SPACEAGORA_CAL_COVERAGE_WINDOW_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate SpaceAGORACalibration
        run: julia --startup-file=no --project=SpaceAGORACalibration.jl -e 'using Pkg; Pkg.instantiate()'

      - name: Run SpaceAGORACalibration tests with coverage
        run: julia --startup-file=no --project=SpaceAGORACalibration.jl --code-coverage=user SpaceAGORACalibration.jl/test/runtests.jl

      - name: SpaceAGORACalibration coverage quality gate
        run: julia --startup-file=no --project=SpaceAGORACalibration.jl SpaceAGORACalibration.jl/test/ci_coverage_quality_gate.jl

  p1-findings-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: P1 findings gate
        run: julia --startup-file=no --project=.AGORA test/ci_p1_findings_gate.jl

      - name: Naming contract gate
        run: julia --startup-file=no --project=.AGORA test/ci_naming_contract_gate.jl

      - name: Architecture contract gate
        run: julia --startup-file=no --project=.AGORA test/ci_architecture_contract_gate.jl

      - name: No legacy ownership gate
        run: julia --startup-file=no --project=.AGORA test/ci_no_legacy_ownership_gate.jl

      - name: No artifact files gate
        run: julia --startup-file=no --project=.AGORA test/ci_no_artifact_files_gate.jl

      - name: Canonical path contract gate
        run: julia --startup-file=no --project=.AGORA test/ci_canonical_path_contract_gate.jl

      - name: No src/benchmarks root gate
        run: julia --startup-file=no --project=.AGORA test/ci_no_src_benchmarks_root_gate.jl

      - name: No dynamics/models gate
        run: julia --startup-file=no --project=.AGORA test/ci_no_dynamics_models_gate.jl

      - name: Vehicle structure boundary gate
        run: julia --startup-file=no --project=.AGORA test/ci_vehicle_structure_boundary_gate.jl

      - name: Src completeness contract gate
        run: julia --startup-file=no --project=.AGORA test/ci_src_completeness_contract_gate.jl

      - name: No legacy include chains gate
        run: julia --startup-file=no --project=.AGORA test/ci_no_legacy_include_chains_gate.jl

      - name: No inert force terms gate
        run: julia --startup-file=no --project=.AGORA test/ci_no_inert_force_terms_gate.jl

      - name: GNC aerobraking boundary gate
        run: julia --startup-file=no --project=.AGORA test/ci_gnc_aerobraking_boundary_gate.jl

      - name: No guidance/control cross-include gate
        run: julia --startup-file=no --project=.AGORA test/ci_no_guidance_control_cross_include_gate.jl

      - name: Aerobraking strategy contract gate
        run: julia --startup-file=no --project=.AGORA test/ci_aerobraking_strategy_contract_gate.jl

      - name: Rotational ownership gate
        run: julia --startup-file=no --project=.AGORA test/ci_rotational_ownership_gate.jl

      - name: Scaffold interface gate
        run: julia --startup-file=no --project=.AGORA test/ci_scaffold_interface_gate.jl

      - name: Typed config equivalence gate
        run: julia --startup-file=no --project=.AGORA test/ci_typed_config_equivalence_gate.jl

      - name: Benchmark wrapper parity gate
        run: julia --startup-file=no --project=.AGORA test/ci_benchmark_wrapper_parity_gate.jl

      - name: Docs contract gate
        run: julia --startup-file=no --project=.AGORA test/ci_docs_contract_gate.jl

      - name: Public API surface gate
        run: julia --startup-file=no --project=.AGORA test/ci_public_api_surface_gate.jl

      - name: HPC/extensibility docs gate
        run: julia --startup-file=no --project=.AGORA test/ci_hpc_extensibility_docs_gate.jl

  documentation-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate runtime environment
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'

      - name: Build docs
        run: julia --project=docs docs/make.jl

      - name: Public API surface gate
        run: julia --startup-file=no --project=.AGORA test/ci_public_api_surface_gate.jl

      - name: HPC/extensibility docs gate
        run: julia --startup-file=no --project=.AGORA test/ci_hpc_extensibility_docs_gate.jl

  ai-review-artifact-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      - name: Update GRAMSuite submodule to latest main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Fetch base ref
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: AI review artifact gate
        env:
          SPACEAGORA_PR_NUMBER: ${{ github.event.pull_request.number }}
          SPACEAGORA_BASE_REF: ${{ github.base_ref }}
        run: julia --startup-file=no --project=.AGORA test/ci_ai_review_artifact_gate.jl
