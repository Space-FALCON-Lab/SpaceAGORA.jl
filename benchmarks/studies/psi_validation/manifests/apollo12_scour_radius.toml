# Radius of the eroding region under the Apollo 12 Lunar Module, versus the
# descent engine's height above the surface.
version = 1

[case]
id = "apollo12_scour_radius"
title = "Apollo 12 surface erosion radius versus engine height"
status = "sourced"
gate_eligible = true
summary = """
The same Apollo 12 analysis reports, at each of eleven altitudes, the "ideal
radius of surface erosion" a0(t) over which the measured erosion rate is taken
to act. The model's counterpart is the outer edge of the annulus where its wall
shear stress exceeds the soil's threshold, which `plume_quantities` returns as
`outer_m`.
"""

[source]
authors = "J. E. Lane and P. T. Metzger"
title = "Estimation of Apollo lunar dust transport using optical extinction measurements"
venue = "Acta Geophysica, vol. 63, no. 2, pp. 568-599"
year = 2015
locator = "Table 2, column a0_k; a0(t) defined in the nomenclature as the ideal radius of surface erosion"
doi = "10.1515/acgeo-2015-0005"
url = "https://arxiv.org/abs/1503.00154"
access = "author preprint is open (arXiv:1503.00154)"
note = """
No per-row uncertainty is published. The series is not monotone in height
(28.0 m at 15.2 m altitude against 25.0 m at 19.2 m, and 54.0 m repeated at both
24.4 m and 29.3 m), so the values are quantized at the several-meter level and
carry scatter of order 25 percent. a0 is a modeling radius chosen so that
mdot * pi * a0^2 reproduces the observed dust flux, not a photographed edge of
a scoured patch: it is the radius of an equivalent uniformly eroding disc.
"""

[conditions]
body = "Moon"
engine = "Apollo LM descent propulsion system"
thrust_n = 12172.0
thrust_basis = "See apollo12_erosion_rate: 16,564.2 lb landed mass (Orloff, NASA SP-2000-4029) times 1.62 m/s^2."
height_convention = "nozzle exit plane above the undisturbed surface"

[model]
quantity = "scour_radius_m"
unit = "m"

[tolerance]
kind = "ratio_band"
low = 0.33
high = 3.0
reason = """
A factor of three either way. The reference is an equivalent-disc radius with
about 25 percent internal scatter and no published error bar, the model's
counterpart is the outer edge of a threshold-crossing annulus, and the two are
defined differently enough that agreeing to better than a factor of two would be
coincidence rather than validation.
"""

[[reference]]
height_m = 1.83
value = 5.0
derived = false

