version = 1

[[scenarios]]
name = "odyssey"
kind = "orbit_events"
planet = "mars"
events = ["peri", "apo"]
# Truth source: per-passage apsis series extracted from the reconstructed NAV
# trajectory (m01_ab_v2.bsp — verified against JPL Horizons, the PDS
# accelerometer archive time tags, and the NAIF archive copy). One row per
# actual apsis passage, axis aligned to the harness event labeling by
# construction. The historical NAV-solution summary files
# (True_Odyssey_*_alts.feather) remain in-tree for reference; they carry
# point scatter and axis jitter of their own and are no longer the graded
# truth.
telemetry_peri = "data/telemetry/Odyssey/True_Odyssey_periapsis_alts_kernel.feather"
telemetry_apo = "data/telemetry/Odyssey/True_Odyssey_apoapsis_alts_kernel.feather"
target_orbits_quick = 8
target_orbits_full = 340
compare_points_quick = 8
compare_points_full = 273
min_eval_points = 6
# Exact NAV-solution Cartesian state at the scenario epoch (2001-11-06T19:00:32
# UTC): Odyssey (-53) relative to MARS in J2000 axes, m and m/s, read from the
# mission kernel m01_ab_v2.bsp (spkezr, no aberration correction). This
# overrides the element-based initial condition; the osculating elements below
# are retained for reference only. At the epoch the kernel osculating state is
# r_apo = 28657.502 km, r_peri = 3492.178 km (95.99 km radius altitude),
# TA = 61.16 deg, so the element IC carried a -97.9 km apoapsis-radius and a
# ~114 deg anomaly (epoch-phase) day-one bias into the 340-orbit campaign.
initial_state_j2000_m = [-1055155.262605, -4333732.239384, -728177.837002, -2371.221148294, -764.635541703, -3175.141365850]
ra_m = 2.8559615e7
# Replay corridor value, in radius altitude above Rp_e. The raw NAV sequence
# sits around 91-93 km over the first propagated passes; 95 km made the first
# compared oblate periapsis ~4 km too high (114.33 vs 110.17 km). A 91 km
# replay IC gives the first compared periapsis at 110.34 km.
rp_altitude_m = 91000.0
i_deg = 93.522
aop_deg = 109.7454
raan_deg = 28.1517
ta_deg = 175.0
# NAV-solution osculating elements are referenced to the Mars mean equator
# (areocentric), not J2000: matched against m01_ab_v2.bsp to <=0.05 deg.
element_frame = "body_equator_inertial"
# The telemetry truth product numbers orbits in mission P-numbering (from the
# MOI periapsis); the scenario epoch sits 16 min after periapsis P19, verified
# against the PDS accelerometer archive (odya_0001: L2P020's periapsis matches
# the NAV kernel's 2001-11-07T11:51 passage to the minute) and by an energy
# cross-check of the kernel state against the telemetry decay curve.
epoch_orbit_offset = 19.0
gravity_model = "inverse_squared"
gravity_harmonics_degree = 20
gravity_harmonics_order = 20
gravity_harmonics_file = "data/Gravity_harmonics_data/Mars50c.csv"
nbody_bodies = ["sun", "earth", "moon", "jupiter"]
srp_enabled = true
srp_cr = 1.3
srp_area_m2 = 3.74
include_wind = true
orbit_altitude_mode = "true"
EI_km = 250.0

[scenarios.maneuvers]
# orbit_numbers use mission P-numbering (from the MOI periapsis), the same
# origin as the telemetry truth files. Flight convention per the NAV-kernel
# periapsis-altitude jumps: burn B fires at the apoapsis AFTER periapsis P(B),
# so its effect first appears at P(B+1). The epoch sits 16 min after P19, so
# epoch-relative apoapsis N lies between P(18+N) and P(19+N): offset 18 places
# burn B between P(B) and P(B+1), matching flight. Walk-in burns (7-16) are
# already in the initial condition and are dropped by the offset filter.
orbit_numbers = [7, 10, 12, 14, 16, 25, 32, 45, 49, 53, 66, 74, 88, 91, 99, 105, 129, 146, 179, 197, 213, 229, 241, 257, 270, 282, 295, 306, 318, 330, 336]
delta_v_mps = [-0.549, -0.549, -0.301, -0.151, -0.303, 0.145, -0.151, -0.099, -0.099, -0.2, -0.2, 0.297, -0.149, -0.149, -0.147, 0.144, 0.144, 1.0, 0.844, 0.6, 0.844, 0.6, 0.6, 1.2, 1.0, 1.2, 1.2, 1.0, 1.0, 1.2, 19.82]
# The final entry is the terminal walk-out raise (kernel-measured: the apo
# burn of 2002-01-11 lifts periapsis 115.0 -> 198.2 km; exact vis-viva at the
# measured radii gives 19.82 m/s). Without it the sim keeps flying the
# corridor after the real spacecraft has left it.
orbit_number_offset = 18
thrust_n = 4.0
isp_s = 220.0
guidance_rate_s = 30.0
control_rate_s = 10.0

# STATE ANCHORS (2026-09): after each trim burn the simulated state is
# replaced by the NAV reconstruction (m01_ab_v2.bsp, Odyssey relative to
# MARS in J2000 axes, m and m/s, spkezr without aberration correction, the
# convention of initial_state_j2000_m). The graded 340-orbit comparison is
# then a sequence of open-loop segments of 4 to 33 orbits between the
# mission's own corrections, which is how the campaign was flown: replayed
# as one open-loop arc, a last-bit change in the build or the runner CPU
# moved the end region by hundreds of kilometres through the timing to
# periapsis-longitude to density loop, and the thresholds became a property
# of the bit pattern rather than of the model. Each anchor sits at the
# apoapsis after periapsis P(B) of burn B, plus the burn duration at 4 N
# and 461 kg, plus 600 s, so the replayed burn has finished; the walk-out
# raise (P336) is not anchored because its 38 min burn ends too close to
# the next periapsis. burn_orbit_numbers also resets the orbit counter at
# each anchor to B - orbit_number_offset + 1, the value between that burn's
# apoapsis and the next, so the replay stays keyed to the anchored
# trajectory when the sim had drifted across an apoapsis crossing.
# Generated by scripts/telemetry/extract_odyssey_burn_anchors.jl; the engine
# prints the removed drift at every anchor (state_anchor lines).
