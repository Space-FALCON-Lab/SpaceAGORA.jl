   <g id="text_25">
    <text style="fill: #1f3f59; font: 700 15px 'Arial'; text-anchor: middle" x="432" y="770.919531" transform="rotate(-0 432 770.919531)">Outputs and optional viewer</text>
   </g>
   <g id="text_26">
    <text style="fill: #1f3f59; font: 12px 'Arial'; text-anchor: middle" x="432" y="792.589375" transform="rotate(-0 432 792.589375)">Write results, analyze them and render the exported scene</text>
   </g>
   <g id="text_27">
    <text style="fill: #1f3f59; font: 10.5px 'Arial'; text-anchor: middle" x="432" y="821.643672" transform="rotate(-0 432 821.643672)">src/io/ + src/analysis/ + viewer/</text>
   </g>
   <g id="text_28">
    <text style="fill: #1f3f59; font: 700 12px 'Arial'; text-anchor: start" x="25" y="866.735625" transform="rotate(-0 25 866.735625)">Supporting owners</text>
