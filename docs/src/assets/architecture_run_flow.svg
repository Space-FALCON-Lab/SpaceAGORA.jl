<svg role="img" aria-labelledby="figure-title figure-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="518.740157pt" height="538.582677pt" viewBox="0 0 518.740157 538.582677" xmlns="http://www.w3.org/2000/svg" version="1.1">
<title id="figure-title">Runtime architecture of SpaceAGORA</title><desc id="figure-desc">Scenario configuration and engine setup feed a repeated solver loop. Environment, individual multicomponent spacecraft and GNC feed the dynamics. Callbacks update commands and save state. The spacecraft collection belongs to the scenario; no general mission scheduler is implied.</desc>
