# Height at which the descent engine first blows dust.
version = 1

[case]
id = "apollo16_erosion_onset_height"
title = "Erosion onset height (CALIBRATION TARGET, never gates)"
status = "calibration_target"
gate_eligible = false
summary = """
Metzger read the onset of dust blowing off the Apollo 16 landing video: the LM
was at 31.5 m altitude when dust is first seen. This is the observable the
model's `threshold_shear_pa` was fitted to (the docs state the 0.15 Pa default
was chosen to put the erosion onset at about 31 m, matching the roughly 30 m at
which the Apollo 11 crew first reported blowing dust), so agreement here is
circular and proves nothing about the model. It is carried as a case so the
circularity is on the record and so a future model that derives its threshold
from soil properties can be scored against a real measurement instead.
"""

[source]
authors = "P. T. Metzger"
title = "Erosion rate of lunar soil under a landing rocket, part 2: Benchmarking and predictions"
venue = "Icarus, vol. 417, article 116135"
year = 2024
locator = "Section 2, final paragraph: \"Dust blowing is first observed in the Apollo 16 landing video when the LM is at 31.5 m altitude\""
doi = "10.1016/j.icarus.2024.116135"
url = "https://arxiv.org/abs/2403.18584"
access = "author preprint is open (arXiv:2403.18584)"
note = """
The paper gives no error bar on 31.5 m. Three sources of uncertainty are
visible. The altitude comes from the Apollo Flight Journal's reconstruction of
the landing video, and the paper's own Fig. 4 compares frames at 37.4 m (before
dust) and 24.4 m (after), so the bracket the video actually establishes is
roughly 24 to 37 m. "The LM is at 31.5 m altitude" does not say whether that is
the vehicle's altitude or the nozzle exit plane's, which differ by the 1.5 m
nozzle offset in the model's default LM configuration. And the onset is when
dust becomes *visible* in a 1972 16 mm frame, which is later than when soil
first moves: for Apollo 12, Lane and Metzger (Acta Geophysica 63, 568-599, 2015)
measure a nonzero erosion rate at the highest altitude they analyze, 36.6 m.
Supporting, weaker evidence for Apollo 11, from the Apollo 11 Lunar Surface
Journal (E. M. Jones and K. Glover, eds., NASA), landing page: Armstrong's
technical debrief, "I first noticed that we were, in fact, disturbing the dust on
the surface when we were something less than 100 feet" (30.5 m), and the
air-to-ground transcript at 102:45:17, Aldrin: "40 feet, down 2 1/2. Picking up
some dust."
"""

[conditions]
body = "Moon"
engine = "Apollo LM descent propulsion system"
thrust_n = 13378.0
thrust_basis = """
Apollo 16 near-hover thrust = landed mass * lunar surface gravity. Orloff, Apollo
by the Numbers (NASA SP-2000-4029), "Selected Mission Weights (lbs)": "LM at
Lunar Landing" = 18,208 lb for Apollo 16, i.e. 8258.0 kg; at g = 1.62 m/s^2 that
is 13,378 N. The reference's own analysis instead used a generic 7.5 t J-mission
lander at thrust-to-weight 1, i.e. 12,150 N; the model's onset height goes as the
square root of thrust, so that choice moves the model's answer by 5 percent.
"""
height_convention = "nozzle exit plane above the undisturbed surface (see the uncertainty note)"

[model]
quantity = "onset_height_m"
unit = "m"

[tolerance]
kind = "ratio_band"
low = 0.5
high = 2.0
reason = """
Recorded for information only: this case can never pass or fail, because the
model parameter that sets the answer was fitted to this observable. The band is
what the video bracket (24 to 37 m) would justify if the case were independent.
"""

[[reference]]
value = 31.5
derived = false
note = "Apollo 16, first visible dust in the landing video"

[[reference]]
value = 36.6
derived = false
note = "Apollo 12: erosion still measurable at the highest altitude analyzed by Lane and Metzger (2015) Table 2, so the physical onset is above this (context row)"
context_only = true

[[reference]]
value = 30.5
derived = true
note = "Apollo 11: Armstrong's \"something less than 100 feet\" in the technical debrief, converted (context row)"
context_only = true
