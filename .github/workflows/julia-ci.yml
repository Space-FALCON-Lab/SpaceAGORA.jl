name: Julia CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  tests-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.12"]
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run test suite
        run: julia --startup-file=no --project=. test/runtests.jl

      - name: Depwarn smoke (Earth thruster example)
        if: matrix.julia-version == '1.12'
        run: julia --startup-file=no --compiled-modules=existing --depwarn=error --project=. examples/Earth_Thruster_Test.jl

  tests:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - tests-matrix
    steps:
      - name: Enforce test matrix success
        run: |
          echo "tests-matrix result=${{ needs.tests-matrix.result }}"
          if [ "${{ needs.tests-matrix.result }}" != "success" ]; then
            echo "Test matrix failed or was cancelled."
            exit 1
          fi

  clean-depot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      # The runner context is not available in job-level env, and GitHub
      # rejects the whole workflow file when it is used there. Export the
      # clean depot path from a step instead.
      - name: Use a clean Julia depot
        run: echo "JULIA_DEPOT_PATH=${RUNNER_TEMP}/julia-clean-depot" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate vendored GRAMSuite in clean depot
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke in clean depot
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate in clean depot
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Clean-depot student entrypoint smoke
        run: julia --startup-file=no --depwarn=error --project=. test/ci_clean_depot_smoke.jl

  threaded-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Threaded smoke
        run: julia --startup-file=no --depwarn=error --project=. test/ci_threaded_smoke.jl

  readme-command-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: README instantiate command
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: README example command
        run: julia --startup-file=no --compiled-modules=existing --project=. examples/Earth_Thruster_Test.jl

  example-suite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Example suite smoke
        run: julia --startup-file=no --project=. test/ci_examples_suite_smoke.jl

  example-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Example regression
        run: julia --startup-file=no --project=. test/integration/examples/runtests.jl

  telemetry-quick-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Telemetry quick regression (GRAM deterministic)
        run: julia --startup-file=no --depwarn=error --project=. benchmarks/studies/telemetry_orbit_accuracy_study.jl quick --enforce=true

      - name: Upload telemetry quick artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-quick-${{ github.run_id }}
          path: |
            output/telemetry_orbit_accuracy_summary.csv
            output/telemetry_orbit_accuracy_errors.csv
          if-no-files-found: warn

  coverage-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JULIA_NUM_THREADS: "4"
      # Coverage debt (July 2026): first real gate run measured 82.84%
      # overall; restore to 90.0 as the debt register in
      # test/ci_coverage_quality_gate.jl burns down.
      SPACEAGORA_COVERAGE_MIN_OVERALL: "80.0"
      SPACEAGORA_COVERAGE_MIN_FILE: "80.0"
      SPACEAGORA_COVERAGE_WINDOW_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Run tests with coverage
        run: julia --startup-file=no --project=. --code-coverage=user test/runtests.jl

      - name: Coverage quality gate
        run: julia --startup-file=no --project=. test/ci_coverage_quality_gate.jl

  calibration-coverage-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
      SPACEAGORA_CAL_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_CAL_COVERAGE_MIN_FILE: "70.0"
      SPACEAGORA_CAL_COVERAGE_WINDOW_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate vendored GRAMSuite
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run SpaceAGORACalibration tests with coverage
        run: julia --startup-file=no --project=. --code-coverage=user SpaceAGORACalibration.jl/test/runtests.jl

      - name: SpaceAGORACalibration coverage quality gate
        run: julia --startup-file=no --project=. SpaceAGORACalibration.jl/test/ci_coverage_quality_gate.jl

  p1-findings-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Contract suite
        run: julia --startup-file=no --project=. test/contracts/pr_runtests.jl

  documentation-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
      # No GITHUB_TOKEN here: this job is a build/strictness gate only.
      # Without credentials Documenter's deploydocs skips deployment, which
      # belongs to the Documentation workflow (docs.yml); with the read-only
      # token it attempts the gh-pages push on main and fails with 403.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate runtime environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Build docs
        run: julia --project=. docs/make.jl

      - name: Public API surface gate
        run: julia --startup-file=no --project=. test/ci_public_api_surface_gate.jl

      - name: HPC/extensibility docs gate
        run: julia --startup-file=no --project=. test/ci_hpc_extensibility_docs_gate.jl

  ai-review-artifact-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Fetch base ref
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: AI review artifact gate
        env:
          SPACEAGORA_PR_NUMBER: ${{ github.event.pull_request.number }}
          SPACEAGORA_BASE_REF: ${{ github.base_ref }}
        run: julia --startup-file=no --project=. test/ci_ai_review_artifact_gate.jl
