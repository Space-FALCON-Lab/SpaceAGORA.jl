   <g id="text_1">
    <text style="fill: #1f3f59; font: 700 12px 'Arial'; text-anchor: start" x="11.338583" y="20.191624" transform="rotate(-0 11.338583 20.191624)">SpaceAGORA simulation architecture</text>
   </g>
   <g id="text_2">
    <text style="fill: #1f3f59; font: 700 10.5px 'Arial'; text-anchor: middle" x="259.370079" y="56.575143" transform="rotate(-0 259.370079 56.575143)">Scenario configuration</text>
   </g>
   <g id="text_3">
    <text style="fill: #1f3f59; font: 9.5px 'Arial'" transform="translate(145.315157 79.050687)">Environment + spacecraft collection + initial conditions</text>
    <text style="fill: #1f3f59; font: 9.5px 'Arial'" transform="translate(165.646641 90.275012)">GNC models, solver and stopping conditions</text>
   </g>
   <g id="text_4">
    <text style="fill: #1f3f59; font: 700 10.5px 'Arial'; text-anchor: middle" x="259.370079" y="141.550528" transform="rotate(-0 259.370079 141.550528)">Engine setup</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f3f59; font: 9.5px 'Arial'" transform="translate(151.211837 164.032167)">Validate models; isolate state; assemble initial state</text>
    <text style="fill: #1f3f59; font: 9.5px 'Arial'" transform="translate(179.459493 175.256491)">Allocate buffers and register callbacks</text>
   </g>
   <g id="text_6">
    <text style="fill: #1f3f59; font: 700 9.5px 'Arial'; text-anchor: start" x="22.677165" y="223.56494" transform="rotate(-0 22.677165 223.56494)">Repeated solve loop</text>
   </g>
   <g id="text_7">
    <text style="fill: #1f3f59; font: 700 10px 'Arial'; text-anchor: middle" x="94.96063" y="257.710298" transform="rotate(-0 94.96063 257.710298)">Environment</text>
   </g>
   <g id="text_8">
    <text style="fill: #1f3f59; font: 9px 'Arial'" transform="translate(61.328755 286.165018)">Frames + gravity</text>
    <text style="fill: #1f3f59; font: 9px 'Arial'" transform="translate(52.817427 296.755979)">Atmosphere + terrain</text>
   </g>
   <g id="text_9">
    <text style="fill: #1f3f59; font: 700 10px 'Arial'; text-anchor: middle" x="259.370079" y="257.771235" transform="rotate(-0 259.370079 257.771235)">Each spacecraft</text>
   </g>
   <g id="text_10">
    <text style="fill: #1f3f59; font: 9px 'Arial'" transform="translate(207.853516 286.038245)">Links, joints, mass, inertia</text>
    <text style="fill: #1f3f59; font: 9px 'Arial'" transform="translate(201.596407 296.777284)">Rigid / articulated / compliant</text>
   </g>
   <g id="text_11">
    <text style="fill: #1f3f59; font: 700 10px 'Arial'; text-anchor: middle" x="423.779528" y="257.710298" transform="rotate(-0 423.779528 257.710298)">GNC models</text>
   </g>
   <g id="text_12">
    <text style="fill: #1f3f59; font: 9px 'Arial'" transform="translate(379.124762 286.165018)">Navigation + guidance</text>
    <text style="fill: #1f3f59; font: 9px 'Arial'" transform="translate(386.017496 296.755979)">Control commands</text>
   </g>
   <g id="text_13">
    <text style="fill: #1f3f59; font: 700 10px 'Arial'; text-anchor: middle" x="259.370079" y="352.164936" transform="rotate(-0 259.370079 352.164936)">Evaluate forces, torques and state derivatives</text>
   </g>
   <g id="text_14">
    <text style="fill: #1f3f59; font: 9.2px 'Arial'; text-anchor: middle" x="259.370079" y="369.469989" transform="rotate(-0 259.370079 369.469989)">Orbital, attitude and supported internal dynamics</text>
   </g>
   <g id="text_15">
    <text style="fill: #1f3f59; font: 700 10px 'Arial'; text-anchor: middle" x="259.370079" y="410.781164" transform="rotate(-0 259.370079 410.781164)">Advance state and execute callbacks</text>
   </g>
   <g id="text_16">
    <text style="fill: #1f3f59; font: 9.2px 'Arial'; text-anchor: middle" x="259.370079" y="429.048579" transform="rotate(-0 259.370079 429.048579)">Scheduled updates, saved values and event detection</text>
   </g>
   <g id="text_17">
    <text style="fill: #1f3f59; font: 8.5px 'Arial'; text-anchor: middle" x="331.653543" y="462.827304" transform="rotate(-0 331.653543 462.827304)">run ends</text>
   </g>
   <g id="text_18">
    <text style="fill: #1f3f59; font: 700 10.5px 'Arial'; text-anchor: middle" x="259.370079" y="490.280852" transform="rotate(-0 259.370079 490.280852)">Recorded outputs + optional viewer</text>
   </g>
   <g id="text_19">
    <text style="fill: #1f3f59; font: 9.5px 'Arial'" transform="translate(164.056133 511.278488)">Saved state, diagnostics, manifest and scene</text>
    <text style="fill: #1f3f59; font: 9.5px 'Arial'" transform="translate(156.139219 522.61414)">Reference comparisons use the resulting outputs</text>
   </g>
  </g>
