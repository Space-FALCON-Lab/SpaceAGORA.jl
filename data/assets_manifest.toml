relative_path = "data/telemetry/GMAT_Examples"
kind = "directory"
required = false
licensing = "lab-private"
detail = "GMAT runs of the parity matrix (incl. the CYGNSS comparison propagation). Synced from Space-FALCON-Lab/spaceagora-verification-data by scripts/dev/fetch_private_telemetry.sh references."

[[asset]]
name = "odyssey_truth_directory"
scope = "verification truth data"
relative_path = "data/telemetry/Odyssey"
kind = "directory"
required = true
licensing = "open-repo"
detail = "Mars Odyssey aerobraking truth files graded by the telemetry regression (test/telemetry_benchmark_manifest.toml), plus the two mission-record altitude files kept for reference."

[[asset]]
name = "vex_truth_directory"
scope = "verification truth data"
relative_path = "data/telemetry/VEx"
kind = "directory"
required = true
licensing = "open-repo"
detail = "Venus Express aerobraking truth files graded by the telemetry regression."

[[asset]]
name = "gmat_earth_aerobraking_truth"
scope = "verification truth data"
relative_path = "data/telemetry/GMAT_Earth_Aerobraking/Earth_Aerobraking_test.feather"
kind = "file"
required = true
licensing = "open-repo"
detail = "GMAT Earth aerobraking run graded by the telemetry regression."

[[asset]]
name = "opssat1_reentry_uhf"
scope = "flight telemetry (public)"
relative_path = "data/telemetry/OPS-SAT1"
kind = "directory"
required = false
licensing = "lab-private"
detail = "ESA OPS-SAT-1 re-entry UHF telemetry, TLEs and ESA notebook; nothing reads it yet. Synced from Space-FALCON-Lab/spaceagora-verification-data by scripts/dev/fetch_private_telemetry.sh references."

[[asset]]
name = "gram_surrogate_directory"
scope = "GRAM surrogate grids"
relative_path = "data/GRAM_surrogate"
kind = "directory"
required = false
licensing = "user-provided"
