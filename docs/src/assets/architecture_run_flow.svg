   <g id="text_1">
    <text style="fill: #1f3f59; font: 700 22px 'Arial'; text-anchor: start" x="25" y="38.015313" transform="rotate(-0 25 38.015313)">SpaceAGORA simulation architecture</text>
   </g>
   <g id="text_2">
    <text style="fill: #1f3f59; font: 11px 'Arial'; text-anchor: start" x="25" y="62.007656" transform="rotate(-0 25 62.007656)">Existing source owners at main 9be384a2; arrows show runtime flow.</text>
   </g>
   <g id="text_3">
    <text style="fill: #1f3f59; font: 700 15px 'Arial'; text-anchor: middle" x="432" y="119.919531" transform="rotate(-0 432 119.919531)">Scenario configuration</text>
   </g>
   <g id="text_4">
    <text style="fill: #1f3f59; font: 12px 'Arial'" transform="translate(268.928437 141.735625)">Environment, spacecraft collection / constellation, initial state,</text>
    <text style="fill: #1f3f59; font: 12px 'Arial'" transform="translate(333.96375 155.040156)">GNC models, solver and run settings</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f3f59; font: 10.5px 'Arial'; text-anchor: middle" x="432" y="179.643672" transform="rotate(-0 432 179.643672)">src/simulation/config/</text>
   </g>
   <g id="text_6">
    <text style="fill: #1f3f59; font: 700 15px 'Arial'; text-anchor: middle" x="432" y="241.736719" transform="rotate(-0 432 241.736719)">Engine setup</text>
   </g>
   <g id="text_7">
    <text style="fill: #1f3f59; font: 12px 'Arial'; text-anchor: middle" x="432" y="263.735625" transform="rotate(-0 432 263.735625)">Prepare runtime state, buffers and callbacks</text>
   </g>
   <g id="text_8">
    <text style="fill: #1f3f59; font: 10.5px 'Arial'; text-anchor: middle" x="432" y="284.643672" transform="rotate(-0 432 284.643672)">src/simulation/engine/</text>
   </g>
   <g id="text_9">
    <text style="fill: #1f3f59; font: 700 15px 'Arial'; text-anchor: middle" x="149" y="364.736719" transform="rotate(-0 149 364.736719)">Environment</text>
   </g>
   <g id="text_10">
    <text style="fill: #1f3f59; font: 12px 'Arial'" transform="translate(75.75125 386.589375)">Atmosphere, gravity, terrain</text>
    <text style="fill: #1f3f59; font: 12px 'Arial'" transform="translate(102.63875 399.851719)">and ephemerides</text>
   </g>
   <g id="text_11">
    <text style="fill: #1f3f59; font: 10.5px 'Arial'; text-anchor: middle" x="149" y="450.515703" transform="rotate(-0 149 450.515703)">src/environment/</text>
   </g>
   <g id="text_12">
    <text style="fill: #1f3f59; font: 700 15px 'Arial'; text-anchor: middle" x="432" y="364.919531" transform="rotate(-0 432 364.919531)">Spacecraft</text>
   </g>
   <g id="text_13">
    <text style="fill: #1f3f59; font: 12px 'Arial'" transform="translate(346.305938 386.589375)">Structure, kinematics, actuators,</text>
    <text style="fill: #1f3f59; font: 12px 'Arial'" transform="translate(348.966563 399.711094)">thermal and robotic assemblies</text>
   </g>
   <g id="text_14">
    <text style="fill: #1f3f59; font: 10.5px 'Arial'; text-anchor: middle" x="432" y="450.515703" transform="rotate(-0 432 450.515703)">src/vehicle/</text>
   </g>
   <g id="text_15">
    <text style="fill: #1f3f59; font: 700 15px 'Arial'; text-anchor: middle" x="715" y="364.736719" transform="rotate(-0 715 364.736719)">GNC</text>
   </g>
   <g id="text_16">
    <text style="fill: #1f3f59; font: 12px 'Arial'" transform="translate(627.61375 386.589375)">Navigation, guidance and control</text>
    <text style="fill: #1f3f59; font: 12px 'Arial'" transform="translate(633.95875 399.851719)">hooks and selected algorithms</text>
   </g>
   <g id="text_17">
    <text style="fill: #1f3f59; font: 10.5px 'Arial'" transform="translate(696.620898 450.643672)">src/gnc/</text>
