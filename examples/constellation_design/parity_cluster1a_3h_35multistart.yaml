# SpaceAGORA parity test configuration for CAPOConstellation cluster 1a, 3 horizons, 35 multistart
# Matches CAPOConstellation config: paper_baseline_3h_lp_warm_35starts_20260601_003446/cluster_1

mission:
  type: "lads_debris_steering"
  drm: "lads_publication"
  n_horizons: 3
  planning_horizon_hours: 48.0
  mission_duration_hours: 144.0

physical_constants:
  mu: 3.986004418e14  # Earth gravitational parameter [m^3/s^2]
  J2: 1.08263e-3      # J2 perturbation coefficient
  radius: 6371.0e3    # Earth radius [m]

debris_params:
  data_source: "synthetic"  # Using synthetic to match CAPOConstellation's 4 clients
  file_path: null
  n_clients: 4
  synthetic_seed: 67
  altitude_range_km: [705.3, 838.8]  # Derived from client a values
  inclination_range_deg: [69.04, 79.06]  # Derived from client inc values

constellation_params:
  max_sats: 30  # max_sats_per_client: 30
  a_min: 7.053137096128762e6  # From CAPOConstellation a_min
  a_max: 8.388030585549399e6  # From CAPOConstellation a_max
  e_max: 0.0
  i_min: 1.2055  # 69.0441 degrees in radians
  i_max: 1.3804  # 79.0604 degrees in radians
  raan_min: 0.0
  raan_max: 6.283185307179586  # 2π

effector_params:
  range: 600000.0      # Laser range [m]
  max_thrust: 1.0      # Max thrust [N]
  sc_mass: 1600.0      # Spacecraft mass [kg]

optimizer_params:
  mode: "full"  # "full", "stage0", "stage1", "stage2"
  stage0_mode: "fhsg"  # "fhsg" or "rl" or "stochastic_greedy"
  
  # Stage 0 FHSG parameters (matching CAPOConstellation)
  finite_horizon_stochastic_greedy_seeding:
    run_count: 35  # CAPOConstellation: run_count: 35
    max_greedy_steps: 2000  # CAPOConstellation: max_greedy_steps: 2000
    stage_a_max_steps: 1000  # CAPOConstellation: stage_a_max_steps: 1000
    stage_b_max_steps: 1000  # CAPOConstellation: stage_b_max_steps: 1000
    batch_size: 1000  # CAPOConstellation: batch_size: 1000
    group_add_count: 5  # CAPOConstellation: group_add_count: 5
    top_k: 8  # CAPOConstellation: top_k: 8
    stage0_cost_mode: "minimum_required_invariant_tube"  # CAPOConstellation
    two_stage_mode: true  # CAPOConstellation: two_stage_mode: true
    unsafe_weight: 1.0  # CAPOConstellation
    safe_weight: 1.0  # CAPOConstellation
    reach_weight: 1.0  # CAPOConstellation
    pred_weight: 1.0  # CAPOConstellation
    safe_margin_epsilon: 5000.0  # CAPOConstellation: safe_margin_epsilon: 5000.0
    pred_margin_epsilon: 5000.0  # CAPOConstellation: pred_margin_epsilon: 5000.0
    certificate_support_margin_m: 5000.0  # CAPOConstellation
    min_standoff_distance_m: 5000.0  # CAPOConstellation: min_standoff_distance_m: 5000.0
    min_safe_support_margin_m: 5000.0  # CAPOConstellation: min_safe_support_margin_m: 5000.0
    active_unsafe_tol: 1.0e-8  # CAPOConstellation
    active_safe_tol: 1.0e-8  # CAPOConstellation
    active_reach_tol: 1.0e-8  # CAPOConstellation
    active_pred_tol: 1.0e-8  # CAPOConstellation
    directional_prefilter_eta: 0.0  # CAPOConstellation
    safe_prefilter_eta: 0.0  # CAPOConstellation
    sample_relaxation_gamma: 1.0  # CAPOConstellation
    safe_direction_count: 72  # CAPOConstellation: safe_direction_count: 72
    correction_direction_count: 72  # CAPOConstellation: correction_direction_count: 72
    reuse_existing_library: false  # CAPOConstellation: reuse_existing_library: false
    write_selected_ic_arrow: true  # CAPOConstellation
    selected_ic_arrow_path: ""
    nc_support_sharing: 2000  # CAPOConstellation: max_greedy_steps
    strict_determinism: true  # CAPOConstellation: strict_determinism: true
    parallel_candidate_sampling: true  # CAPOConstellation
    parallel_candidate_scoring: true  # CAPOConstellation
    parallel_runs: false  # CAPOConstellation: parallel_runs: false
    thread_batch_chunk: 32  # CAPOConstellation: thread_batch_chunk: 32
    show_progress_bars: true  # CAPOConstellation
    log_progress_csv: true  # CAPOConstellation
    progress_log_every_step: true  # CAPOConstellation
    fail_if_infeasible: true  # CAPOConstellation
    sampling_max_tries: 4096  # CAPOConstellation
    use_pred_repair: false  # CAPOConstellation: use_pred_repair: false
    repair_interval: 10  # CAPOConstellation
    merge_shells_across_runs: true  # CAPOConstellation
    stage1_probe_enabled: false  # CAPOConstellation
    stage1_probe_skip_stage2: true  # CAPOConstellation
    stage1_probe_require_solved: true  # CAPOConstellation
  
  # Stage 1 parameters (matching CAPOConstellation)
  controllable_set_dirs: 72  # CAPOConstellation: controllable_set_dirs: 72
  controllable_keepout_dirs: 72  # CAPOConstellation: controllable_keepout_dirs: 72
  stage1_keepout_margin: 2000.0  # CAPOConstellation: stage1_keepout_margin: 2000.0
  stage1_min_safe_support_margin: 0.0  # CAPOConstellation: stage1_min_safe_support_margin: 0.0
  stage1_certificate_mode: "support_function"  # CAPOConstellation
  controllable_set_mode: "polyhedral"  # CAPOConstellation
  stage1_lp_warm_start_enabled: true  # CAPOConstellation
  stage1_lp_warm_start_coeff_rel_drop: 1e-12  # Default
  stage1_lp_warm_start_verbose: false
  stage1_lp_warm_start_plot_only: false
  stage1_beta_ladder_enabled: true  # CAPOConstellation
  stage1_beta_ladder_start: 0.01  # CAPOConstellation
  stage1_beta_ladder_step: 0.01  # CAPOConstellation
  stage1_beta_ladder_stop: 1.0  # CAPOConstellation
  stage1_beta_ladder_max_attempts: 101  # CAPOConstellation: stage1_beta_ladder_enabled with 0.01 step to 1.0 = 101 points
  constructive_multistart_count: 101  # CAPOConstellation: constructive_multistart_count: 101
  constructive_predecessor_contraction_min: 0.5  # CAPOConstellation
  stage1_nonconvex_fractionality_penalty_enabled: false  # CAPOConstellation default (convex)
  
  # Optimization weights (matching CAPOConstellation)
  num_sats_weight: 100.0  # CAPOConstellation
  l1_reg_weight: 10.0  # CAPOConstellation
  tube_size_weight: 1.0e-5  # CAPOConstellation
  beta_threshold: 0.1  # CAPOConstellation
  beta_budget: 500  # CAPOConstellation: beta_budget: 500
  
  # Solver settings (matching CAPOConstellation)
  solver: "clarabel"  # CAPOConstellation uses clarabel for stage2_safe_direction_lp_solver
  tolerance: 0.01  # CAPOConstellation: tolerance: 0.01
  max_iter: 10000  # CAPOConstellation: max_iter: 10000
  capo_log_solver_trace: true  # CAPOConstellation
  
  # Other settings
  relative_dynamics_mode: "cw_eci"  # CAPOConstellation default
  repeated_horizon_enabled: true  # CAPOConstellation
  repeated_horizon_client_cache_enabled: true  # CAPOConstellation
  compact_phase_access_single_horizon: false  # CAPOConstellation
  certificate_mode: "support_function"  # CAPOConstellation
  controllable_set_relation: "subset"  # CAPOConstellation
  lookahead_predecessor: true  # CAPOConstellation
  lookahead_mode: "mission_time"  # CAPOConstellation
  planning_mode: "multi_horizon_mission"  # CAPOConstellation
  planning_required_relation: "subset"  # CAPOConstellation
  skip_stage2: false  # CAPOConstellation
  stage2_mode: "optimal_control"  # CAPOConstellation
  
  # Fidelity
  fidelity_mode: "keplerian"  # CAPOConstellation default
  
  # Stage 0 caching
  use_cached_stage0: false
  cached_stage0_data: null
  
  # High-fidelity generator propagation (Stage 0.5) - disabled for parity test
  use_high_fidelity_generators: false
  high_fidelity_preset: 0
  disturbance_enable_j2: false
  disturbance_enable_harmonics: false
  disturbance_enable_atmosphere: false
  disturbance_enable_srp: false
  disturbance_enable_third_body: false
  high_fidelity_num_threads: 8
  high_fidelity_cache_enabled: true
  high_fidelity_cache_dir: "cache/high_fidelity_generators"

sim_params:
  dt: 300.0          # CAPOConstellation: dt: 300.0
  N: 576             # CAPOConstellation: N: 576 (planning horizon)
  rng_seed: 67       # CAPOConstellation: rng_seed: 67

plotting:
  save: true
  display: false
  base_outdir: "plots/constellation/parity_cluster1a_3h_35multistart"
  plot_stage1_lp_warm_start_beta_histogram: true  # CAPOConstellation
  plot_tube_3d: true
  plot_access_matrix: true
  plot_stage2_trajectories: true
