name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      # - name: Update GRAMSuite submodule to latest main
      #   env:
      #     GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
      #   run: |
      #     git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      #     sed -i 's|/GRAMSuite\.jl\.git|/dev-GRAMSuite\.jl\.git|' .gitmodules
      #     git submodule sync data/GRAMSuite.jl
      #     git submodule update --init --recursive --remote data/GRAMSuite.jl

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Build and deploy docs
        run: julia --project=. docs/make.jl

      - name: Upload undocumented public API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: undocumented-public-api-${{ github.run_id }}
          path: docs/build/undocumented_public_exports.txt
          if-no-files-found: warn
