name: Documentation

# Run ONLY when documentation-relevant content is merged into the default
# branch, or on manual dispatch.  Documentation is NOT built on every pull
# request — the CI workflow covers the same source-validation checks for
# those events using the prebuilt cached Julia environment.
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  docs:
    name: Build & validate docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
      JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "lts"

      # Restore the prebuilt Julia package cache.
      - uses: julia-actions/cache@v2

      # Restore the CondaPkg environment from cache.
      - name: Cache CondaPkg environment
        uses: actions/cache@v4
        with:
          path: ~/.julia/condapkg/SpaceAGORA
          key: condapkg-${{ runner.os }}-${{ hashFiles('.SpaceAGORA/CondaPkg.toml') }}
          restore-keys: condapkg-${{ runner.os }}-

      # Instantiate the project environment (uses the cache above).
      - name: Instantiate environment
        run: julia --startup-file=no --project=.SpaceAGORA -e 'using Pkg; Pkg.instantiate()'

      # Validate that all source files load cleanly — the same check the
      # documentation build would surface as broken docstrings / load errors.
      - name: Source-load validation
        run: |
          julia --startup-file=no --depwarn=error --project=.SpaceAGORA -e '
            include("src/physical_models/Planet_data.jl")
            include("src/config.jl")
            println("source_load_validation_ok")
          '

      # Run the full unit test suite (planet data, spacecraft model, etc.)
      # to confirm documentation examples remain consistent with the code.
      - name: Run test suite
        run: julia --startup-file=no --project=.SpaceAGORA test/runtests.jl
