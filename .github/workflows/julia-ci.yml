name: Julia CI

on:
  push:
  pull_request:

jobs:
  build-ci-sysimage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Instantiate sysimage build environment
        run: julia --startup-file=no --project=build -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Cache SpaceAGORA sysimage
        id: sysimage-cache
        uses: actions/cache@v4
        with:
          path: SpaceAGORA.so
          key: spaceagora-sysimage-${{ runner.os }}-julia-1.12-${{ hashFiles('Project.toml', 'Manifest.toml', 'build/Project.toml', 'build/Manifest.toml', 'build/build_sysimage.jl', 'src/precompile_workload.jl') }}

      - name: Build SpaceAGORA sysimage
        if: steps.sysimage-cache.outputs.cache-hit != 'true'
        env:
          JULIA_IMAGE_THREADS: "1"
          SPACEAGORA_CI_MIN_SYSIMAGE: "1"
        run: julia --startup-file=no --project=build build/build_sysimage.jl

      - name: Upload SpaceAGORA sysimage
        uses: actions/upload-artifact@v4
        with:
          name: spaceagora-ci-sysimage
          path: SpaceAGORA.so
          if-no-files-found: error

  tests-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-ci-sysimage]
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.12"]
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Download SpaceAGORA sysimage
        uses: actions/download-artifact@v4
        with:
          name: spaceagora-ci-sysimage
          path: .

      - name: Run test suite
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. test/runtests.jl

      - name: Depwarn smoke (Earth thruster example)
        if: matrix.julia-version == '1.12'
        run: julia --startup-file=no --sysimage SpaceAGORA.so --compiled-modules=existing --depwarn=error --project=. examples/Earth_Thruster_Test.jl

  tests:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - tests-matrix
    steps:
      - name: Enforce test matrix success
        run: |
          echo "tests-matrix result=${{ needs.tests-matrix.result }}"
          if [ "${{ needs.tests-matrix.result }}" != "success" ]; then
            echo "Test matrix failed or was cancelled."
            exit 1
          fi

  clean-depot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_DEPOT_PATH: ${{ runner.temp }}/julia-clean-depot
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Instantiate in clean depot
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Clean-depot student entrypoint smoke
        run: julia --startup-file=no --depwarn=error --project=. test/ci_clean_depot_smoke.jl

  threaded-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Threaded smoke
        run: julia --startup-file=no --depwarn=error --project=. test/ci_threaded_smoke.jl

  readme-command-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: README instantiate command
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: README example command
        run: julia --startup-file=no --compiled-modules=existing --project=. examples/Earth_Thruster_Test.jl

  example-suite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-ci-sysimage]
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Download SpaceAGORA sysimage
        uses: actions/download-artifact@v4
        with:
          name: spaceagora-ci-sysimage
          path: .

      - name: Example suite smoke
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. test/ci_examples_suite_smoke.jl

  example-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-ci-sysimage]
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Download SpaceAGORA sysimage
        uses: actions/download-artifact@v4
        with:
          name: spaceagora-ci-sysimage
          path: .

      - name: Example regression
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. test/integration/examples/runtests.jl

  telemetry-quick-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [build-ci-sysimage]
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Download SpaceAGORA sysimage
        uses: actions/download-artifact@v4
        with:
          name: spaceagora-ci-sysimage
          path: .

      - name: Telemetry quick regression (GRAM deterministic)
        run: julia --startup-file=no --sysimage SpaceAGORA.so --depwarn=error --project=. benchmarks/studies/telemetry_orbit_accuracy_study.jl quick --enforce=true

      - name: Upload telemetry quick artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-quick-${{ github.run_id }}
          path: |
            output/telemetry_orbit_accuracy_summary.csv
            output/telemetry_orbit_accuracy_errors.csv
          if-no-files-found: warn

  coverage-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [build-ci-sysimage]
    env:
      JULIA_NUM_THREADS: "2"
      SPACEAGORA_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_COVERAGE_MIN_FILE: "80.0"
      SPACEAGORA_COVERAGE_WINDOW_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean

      - name: Download SpaceAGORA sysimage
        uses: actions/download-artifact@v4
        with:
          name: spaceagora-ci-sysimage
          path: .

      - name: Run tests with coverage
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. --code-coverage=user test/runtests.jl

      - name: Coverage quality gate
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. test/ci_coverage_quality_gate.jl

  calibration-coverage-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-ci-sysimage]
    env:
      JULIA_NUM_THREADS: "2"
      SPACEAGORA_CAL_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_CAL_COVERAGE_MIN_FILE: "70.0"
      SPACEAGORA_CAL_COVERAGE_WINDOW_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate SpaceAGORACalibration
        run: julia --startup-file=no --project=SpaceAGORACalibration.jl -e 'using Pkg; Pkg.instantiate()'

      - name: Download SpaceAGORA sysimage
        uses: actions/download-artifact@v4
        with:
          name: spaceagora-ci-sysimage
          path: .

      - name: Run SpaceAGORACalibration tests with coverage
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=SpaceAGORACalibration.jl --code-coverage=user SpaceAGORACalibration.jl/test/runtests.jl

      - name: SpaceAGORACalibration coverage quality gate
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=SpaceAGORACalibration.jl SpaceAGORACalibration.jl/test/ci_coverage_quality_gate.jl

  p1-findings-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Contract suite
        run: julia --startup-file=no --project=. test/contracts/pr_runtests.jl

  documentation-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate runtime environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Build docs
        run: julia --project=. docs/make.jl

      - name: Public API surface gate
        run: julia --startup-file=no --project=. test/ci_public_api_surface_gate.jl

      - name: HPC/extensibility docs gate
        run: julia --startup-file=no --project=. test/ci_hpc_extensibility_docs_gate.jl

  ai-review-artifact-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Fetch base ref
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: AI review artifact gate
        env:
          SPACEAGORA_PR_NUMBER: ${{ github.event.pull_request.number }}
          SPACEAGORA_BASE_REF: ${{ github.base_ref }}
        run: julia --startup-file=no --project=. test/ci_ai_review_artifact_gate.jl
