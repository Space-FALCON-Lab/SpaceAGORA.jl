# Depth of the toroidal scour the Apollo plume left in the regolith.
version = 1

[case]
id = "apollo_scour_depth"
title = "Apollo post-landing scour depth"
status = "sourced"
gate_eligible = true
summary = """
The only published statement of how deep an Apollo landing actually cut into the
regolith. The model now keeps a radial grid of eroded depth under the vehicle
(`PlumeSurfaceInteractionModel`'s crater state), so the erosion regimes' local
mass flux is integrated in time at each radius and divided by the soil's in-situ
bulk density. The case is scored on the deepest point of that profile over the
same Apollo 12 descent the total-eroded-mass case integrates, which is the only
descent in this study with published altitude-versus-time samples.

Before the crater state existed this case was recorded as `not_modeled`: the
model reported a mass erosion rate and the annulus the threshold was exceeded
in, with no bookkeeping of where in depth the soil came from.
"""

[source]
authors = "P. T. Metzger"
title = "Erosion rate of lunar soil under a landing rocket, part 2: Benchmarking and predictions"
venue = "Icarus, vol. 417, article 116135"
year = 2024
locator = "Section 5, \"about 6 cm were eroded at the deepest point between 1 and 2 m radius from centerline in a toroidal crater. The extremes of plausibility for this estimate are 3 cm to 12 cm depth\""
doi = "10.1016/j.icarus.2024.116135"
url = "https://arxiv.org/abs/2403.18584"
access = "author preprint is open (arXiv:2403.18584)"
note = """
The estimate is attributed in that paper to P. T. Metzger, J. Smith and J. E.
Lane, "Phenomenology of soil erosion due to rocket exhaust on the Moon and the
Mauna Kea lunar test site", Journal of Geophysical Research 116, E06005 (2011),
doi:10.1029/2010JE003745, which interpreted the Apollo erosional features
(headed and unheaded erosional remnants, micro-scarps) with the help of thruster
plume tests on volcanic tephra at a field site. The 2024 paper is explicit that
the crater "was not directly measurable in the Apollo post-landing imagery
because the crater is shallower and more gradual than the natural terrain
variations, and because it is spread over an area wider than the images", so
6 cm (3 to 12 cm) is an interpretation, not a measurement, and the quoted range
is the stated extremes of plausibility rather than a standard deviation.
"""

[conditions]
body = "Moon"
engine = "Apollo LM descent propulsion system"
thrust_n = 12172.0
thrust_basis = "See apollo12_erosion_rate: 16,564.2 lb landed mass (Orloff, NASA SP-2000-4029) times 1.62 m/s^2."
height_convention = "nozzle exit plane above the undisturbed surface"
integration = """
Trapezoidal in time over the eleven (t, h) samples of Lane and Metzger (2015)
Table 2, the same nodes the total-eroded-mass case uses, on a 64-node
logarithmic radial grid from 0.05 m to 40 m. The reference is Apollo 11's
landing and the profile is Apollo 12's; the two landings are the same vehicle at
the same near-hover thrust, and no altitude-versus-time profile has been
published for Apollo 11 at this resolution. That substitution is part of what
the tolerance below has to cover.

The integration credits every sample to the same patch of ground: neither the
model's crater grid nor this harness follows the impingement point as the
vehicle translates. A real descent moves hundreds of meters horizontally while
it is eroding, so the depth computed here is an UPPER BOUND on the depth at any
one point, and the model's under-prediction of the reference is therefore larger
than the ratio shows.
"""

[model]
quantity = "crater_depth_m"
unit = "m"

[tolerance]
kind = "ratio_band"
low = 0.5
high = 2.0
reason = """
The reference's own stated extremes of plausibility, 3 cm to 12 cm about 6 cm,
which is exactly a factor of two either way. The source is explicit that the
crater "was not directly measurable in the Apollo post-landing imagery" and that
6 cm is an interpretation with those extremes rather than a measurement with a
standard deviation, so the band is the reference's own spread and nothing has
been widened to make the model pass. Nothing narrower could be justified; a
wider band would not be a test.
"""

[[reference]]
value = 0.06
derived = false
note = "deepest point, between 1 and 2 m radius from centerline"

[[reference]]
value = 0.03
derived = false
note = "shallow extreme of plausibility"
context_only = true

[[reference]]
value = 0.12
derived = false
note = "deep extreme of plausibility"
context_only = true

# Descent profile, identical to apollo_total_eroded_mass: Lane and Metzger
# (2015) Table 2, altitude versus time before touchdown.
[[profile]]
t_s = -50.7
height_m = 36.6

[[profile]]
