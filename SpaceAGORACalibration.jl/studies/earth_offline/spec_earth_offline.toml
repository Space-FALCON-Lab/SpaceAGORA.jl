schema_version = 1
id = "telemetry_earth_offline_v1"
name = "Telemetry Earth Offline Study"
description = "Earth-only offline calibration study with physically influential Earth parameters"
output_root = "output/calibration/earth_offline"
seed = 42
objective = "telemetry_robust_huber"
verification_script = "scripts/verify_telemetry.jl"
manifest_paths = ["SpaceAGORACalibration.jl/studies/earth_offline/manifest_earth_offline.toml"]

[scenario_weights]
earth_gmat = 1.0

[[parameters]]
name = "earth_bus_mass_scale"
kind = "continuous"
lower = 0.95
upper = 1.05
transform = "mul"
manifest_targets = ["scenarios[name=earth_gmat].spacecraft.bus_mass_kg"]

[[parameters]]
name = "earth_prop_mass_scale"
kind = "continuous"
lower = 0.75
upper = 1.30
transform = "mul"
manifest_targets = ["scenarios[name=earth_gmat].spacecraft.prop_mass_kg"]

[[parameters]]
name = "earth_bus_dims_scale"
kind = "continuous"
lower = 0.9
upper = 1.1
transform = "mul"
manifest_targets = ["scenarios[name=earth_gmat].spacecraft.bus_dims_m"]

[[parameters]]
name = "earth_panel_dims_scale"
kind = "continuous"
lower = 0.9
upper = 1.1
transform = "mul"
manifest_targets = ["scenarios[name=earth_gmat].spacecraft.panel_dims_m"]

[[parameters]]
name = "earth_panel_offset_scale"
kind = "continuous"
lower = 0.85
upper = 1.15
transform = "mul"
manifest_targets = ["scenarios[name=earth_gmat].spacecraft.panel_offset_y_m"]

[[parameters]]
name = "earth_gravity_model"
kind = "categorical"
choices = ["inverse_squared", "inverse_squared_j2"]
transform = "set"
manifest_targets = ["scenarios[name=earth_gmat].gravity_model"]

[[parameters]]
name = "earth_gravity_harmonics_degree"
kind = "integer"
lower = 20
upper = 70
transform = "set"
manifest_targets = [
  "scenarios[name=earth_gmat].gravity_harmonics_degree",
  "scenarios[name=earth_gmat].gravity_harmonics_order"
]

[[parameters]]
name = "earth_gram_perturb_scale_add"
kind = "continuous"
lower = 0.0
upper = 0.08
transform = "add"
manifest_targets = ["scenarios[name=earth_gmat].atmosphere_truth.gram_perturbation_scales"]

[[parameters]]
name = "solver_mode"
kind = "categorical"
choices = ["auto_stiff", "rodas5p", "split_imex", "tsit5", "multirate"]
transform = "set"
env_targets = ["SPACEAGORA_TELEMETRY_SOLVER_MODE"]

[[parameters]]
name = "dt_max_orbit_s"
kind = "continuous"
lower = 25.0
upper = 120.0
transform = "set"
env_targets = ["SPACEAGORA_TELEMETRY_DT_MAX_ORBIT"]

[[parameters]]
name = "dt_max_atm_s"
kind = "continuous"
lower = 0.05
upper = 0.35
transform = "set"
env_targets = ["SPACEAGORA_TELEMETRY_DT_MAX_ATM"]

[[parameters]]
name = "solver_maxiters"
kind = "integer"
lower = 5000000
upper = 20000000
transform = "set"
env_targets = ["SPACEAGORA_TELEMETRY_SOLVER_MAXITERS"]

[budgets]
initial_samples = 12
global_iters = 18
batch_size = 1
parallel_evaluations = 4
global_acquisition = "lcb"
bo_pool_size = 256
bo_length_scale = 0.35
bo_noise = 1.0e-6
bo_kappa = 1.96
bo_xi = 0.01
local_refine_strategy = "trust_region"
local_refine_topk = 3
local_refine_steps = 6
local_refine_neighbors = 3
local_refine_init_scale = 0.12
local_refine_shrink = 0.6
local_refine_expand = 1.2
local_refine_min_improvement = 1.0e-6
robustness_samples = 8
initial_design = "lhs"
robustness_uncertainty = "normal"
uncertainty_atm_scale = 0.02
uncertainty_ic_scale = 0.0015
robust_ranking = "weighted"
robust_cvar_alpha = 0.9
robust_p95_weight = 0.5
robust_fail_weight = 6.0
objective_huber_delta = 1.0
objective_lambda_fail = 30.0
objective_lambda_time = 2.0
objective_runtime_budget_s = 1800.0
objective_telemetry_noise_frac = 0.01
