name: CI

on:
  push:
    branches: ["main", "master"]

# Restrict the default GITHUB_TOKEN to the minimum required permissions.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Core test matrix — run the full unit test suite on every supported
  # Julia version with code-coverage instrumentation.
  # ------------------------------------------------------------------
  tests-matrix:
    name: Tests – Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.12"]
    env:
      JULIA_NUM_THREADS: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      # 1. Install Julia
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      # 2. Restore ~/.julia/packages and compiled artifacts from cache.
      #    The cache key changes whenever Project.toml or Manifest.toml
      #    changes, so packages are only re-downloaded when needed.
      - uses: julia-actions/cache@v2

      # 3. Restore the CondaPkg conda environment from cache.
      #    Keyed on CondaPkg.toml so only invalidated when Python deps change.
      - name: Cache CondaPkg environment
        uses: actions/cache@v4
        with:
          path: ~/.julia/condapkg/SpaceAGORA
          key: condapkg-${{ runner.os }}-${{ hashFiles('CondaPkg.toml') }}
          restore-keys: condapkg-${{ runner.os }}-

      # 4. Instantiate vendored GRAMSuite first so CI fails fast on its environment.
      - name: Instantiate vendored GRAMSuite
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      # 5. Instantiate the main environment using whatever was restored from cache.
      - name: Instantiate environment
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh --clean
        
      # 6. Run the full unit test suite with code-coverage instrumentation.
      - name: Run test suite
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: julia --startup-file=no --project=. --code-coverage=user test/runtests.jl

      # 7. Upload coverage data so it can be inspected in the Actions artifacts panel.
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.julia-version }}-${{ github.run_id }}
          path: "**/*.cov"
          if-no-files-found: ignore

      # 8. Deprecation-warning smoke: verify the core source loads without
      #    triggering any deprecation warnings.
      - name: Depwarn smoke
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: |
          julia --startup-file=no --depwarn=error --project=. -e '
            using SpaceAGORA
            println("depwarn_smoke_ok")
          '

  # ------------------------------------------------------------------
  # Rollup job — required status check that enforces matrix success.
  # Branch-protection rules should require this job, not the individual
  # matrix legs.
  # ------------------------------------------------------------------
  tests:
    name: Tests (all versions)
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tests-matrix]
    steps:
      - name: Enforce test matrix success
        run: |
          echo "tests-matrix result=${{ needs.tests-matrix.result }}"
          if [ "${{ needs.tests-matrix.result }}" != "success" ]; then
            echo "Test matrix failed or was cancelled."
            exit 1
          fi

  # ------------------------------------------------------------------
  # Threaded smoke — ensures the code is safe under multi-threading.
  # ------------------------------------------------------------------
  threaded-smoke:
    name: Threaded smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - uses: julia-actions/cache@v2

      - name: Cache CondaPkg environment
        uses: actions/cache@v4
        with:
          path: ~/.julia/condapkg/SpaceAGORA
          key: condapkg-${{ runner.os }}-${{ hashFiles('CondaPkg.toml') }}
          restore-keys: condapkg-${{ runner.os }}-

      - name: Instantiate vendored GRAMSuite
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using Pkg; Pkg.instantiate()'

      - name: GRAMSuite load smoke
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: julia --startup-file=no --project=data/GRAMSuite.jl -e 'using GRAMSuite; println("gramsuite_load_ok")'

      - name: Instantiate environment
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Threaded smoke
        env:
          JULIA_CONDAPKG_ENV: ~/.julia/condapkg/SpaceAGORA
        run: |
          julia --startup-file=no --depwarn=error --project=. test/ci_threaded_smoke.jl
