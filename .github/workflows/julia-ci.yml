name: Julia CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Run test suite
        run: julia --project=.AGORA test/runtests.jl

      - name: Depwarn smoke (Earth thruster example)
        run: julia --depwarn=error --project=.AGORA src/examples/Earth_Thruster_Test.jl
