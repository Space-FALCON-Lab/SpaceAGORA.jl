# Shard counts and measured costs for Julia CI (.github/workflows/julia-ci.yml).
#
# .github/scripts/ci_shard_plan.py splits the test items and the examples
# across `shards` jobs by these weights, in minutes on a hosted runner. Weights
# only balance the shards; an item missing here still runs, at its kind's
# default_weight. The tests, coverage-quality-gate and example-suite-smoke jobs
# print every item's measured minutes (ci_shard_verify.py) for updating this
# file.
#
# Item kinds: suite:NN (test/suites), probe:FILE (09_probe_drivers.jl's list),
# unit:PATH (test/unit/runtests.jl includes), plus the workflow steps "grid"
# (native-free grid adapter suite) and "depwarn" (Earth thruster depwarn smoke).
#
# Measured on run 36468727261 (2026-09-28). A unit file's time includes the
# Julia start-up of its shard's unit process when it was the first one there.
# Suites 02, 04 and 05 failed part-way in that run, so they keep their longer
# timings from the unsharded run 36216067512.

[tests.plain]
shards = 8
workflow_items = ["grid", "depwarn"]
# Extra start-up of the one unit-suite process a shard with unit files runs;
# charging it keeps the unit files on fewer shards.
unit_process_overhead = 1.0
default_weight = { suite = 3.0, probe = 1.2, unit = 0.35, other = 1.0 }

[tests.coverage]
shards = 12
workflow_items = ["grid"]
unit_process_overhead = 1.5
default_weight = { suite = 4.0, probe = 1.9, unit = 0.5, other = 1.0 }

[examples]
shards = 5
default_weight = { other = 1.2 }

