[planner.guard]
# Revision 20c, guard v2, FROZEN (results_rev20_guard_v2.md section 4; planner_rev20_replay.GUARD_V2). All ASSUMED (tuned on 27 dev paths), named; the switch is the per-arm ttg_guard (default false).
# Fixed in the code: actuator = tube (the bisected fraction tightens the tube edge on the needed side, the upper edge is never raised), infeasible mode = pin (fly the largest-tightening plan), kappa statistic = median, edge margin 0.
pen_g = 0.1                         # ASSUMED: fixed cost per burn (m/s) in the guard's DP solves
rel_slack = 0.15                    # ASSUMED: slack grows with the predicted time to go
s_frac = 0.5                        # ASSUMED: slack = s_frac x W_max + rel_slack x (time to go)
aim_frac = 0.5                      # ASSUMED: the bisection stops when the prediction is within t* +/- aim_frac x s
anchor_k = 15                       # ASSUMED: level forecast anchored on the mean residual of the last anchor_k passes
anchor_from_pass = 6                # ASSUMED: the anchored forecast is used from this decision on
bias_steps = 60                     # ASSUMED: the observed drift bias is persisted this many steps
k_window = 20                       # ASSUMED: median of the last k_window drop ratios (kappa_hat)
ema_beta = 0.5                      # ASSUMED: smoothing of the predicted arrival over decisions
eps_max = 1.0                       # ASSUMED: fraction of the tube width the edge may move at the largest tightening
max_solves = 12                     # SOURCED: Revision 18 design (b)
dev_thr_g = 0.05                    # ASSUMED (m/s): the guard's burn replaces the planner's own only when it differs by more than this
start_pass = 2                      # ASSUMED: guard active from the first decision
node_check = false                  # Revision 22 item 2: node check, DISABLED; enabling it requires a value for node_tol_deg (none given: the key is deliberately absent)
w_max_periods = 3.0                 # ASSUMED (Revision 18): W_max = 3 final-orbit periods
w_rp_m = 3480000.0                  # ASSUMED: periapsis radius of the nominal closing orbit, the basis of W_max (GUARD_W_RP_M)
