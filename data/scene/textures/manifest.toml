source_url = "https://planetarymaps.usgs.gov/mosaic/Venus_Magellan_C3-MDIR_ClrTopo_Global_Mosaic_6600m.tif"
license = "public-domain (USGS/NASA)"
width = 4096
height = 2048
lon_left_deg = -180.0

