  coverage-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - tests-matrix
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      # Every shard's .cov files land back under src/. The gate keys line counts
      # on (source, line) and sums them, so the union across shards is exactly
      # the coverage one unsharded run would have produced. Filenames carry the
      # producing PID, so shards cannot collide.
      - name: Download coverage from every shard
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage quality gate
        env:
          # download-artifact rewrites mtimes to extraction time, so the gate's
          # freshness window has to span the download rather than the test run.
          SPACEAGORA_COVERAGE_WINDOW_SECONDS: "7200"
        run: julia --startup-file=no --project=. test/coverage/runtests.jl

