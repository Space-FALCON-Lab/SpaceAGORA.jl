<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc">
<title id="title">SpaceAGORA simulation flow and source owners</title>
<desc id="desc">Configuration enters engine setup. During the repeated solve loop, environment, spacecraft and GNC feed the right-hand side. The solver advances state and runs scheduled or event callbacks. Saved values become output files and an optional viewer. This is runtime data flow, not module dependency order.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#1f3f59"/></marker></defs>
<rect width="1000" height="1040" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f3f59}.title{font-size:21px;font-weight:700}.body{font-size:17px}.owner{font-size:14px;fill:#2f5f7f}.label{font-size:15px;font-weight:700;fill:#2f5f7f}.arrow{fill:none;stroke:#1f3f59;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect x="150" y="30" width="700" height="115" rx="12" fill="#f2f7fc" stroke="#8cbde7"/>
<text x="500.0" y="60" class="title" text-anchor="middle">Configuration</text>
<text x="500.0" y="86" class="body" text-anchor="middle">Mission, models, initial time, solver and tolerances</text>
<text x="500.0" y="128" class="owner" text-anchor="middle">src/core/state/simulation_configuration.jl</text>
<path d="M500,145 V179" class="arrow"/>
<rect x="150" y="187" width="700" height="115" rx="12" fill="#f2f7fc" stroke="#8cbde7"/>
<text x="500.0" y="217" class="title" text-anchor="middle">Engine setup</text>
<text x="500.0" y="243" class="body" text-anchor="middle">Validate, isolate state, build initial conditions and callbacks</text>
<text x="500.0" y="285" class="owner" text-anchor="middle">src/simulation/engine/</text>
<path d="M500,302 V320" class="arrow"/>
<rect x="30" y="330" width="940" height="495" rx="18" fill="#fafcff" stroke="#8cbde7" stroke-dasharray="6 5"/>
<text x="50" y="354" class="label" text-anchor="start">DURING THE SOLVE: REPEATED UNTIL A STOP CONDITION</text>
<rect x="60" y="377" width="280" height="128" rx="12" fill="#fff" stroke="#8cbde7"/>
<text x="200.0" y="407" class="title" text-anchor="middle">Environment</text>
<text x="200.0" y="433" class="body" text-anchor="middle">Frames, atmosphere,</text>
<text x="200.0" y="455" class="body" text-anchor="middle">gravity and terrain</text>
<text x="200.0" y="488" class="owner" text-anchor="middle">src/environment/</text>
<rect x="360" y="377" width="280" height="128" rx="12" fill="#fff" stroke="#8cbde7"/>
<text x="500.0" y="407" class="title" text-anchor="middle">Spacecraft</text>
<text x="500.0" y="433" class="body" text-anchor="middle">One craft or a constellation</text>
<text x="500.0" y="455" class="body" text-anchor="middle">Mass, inertia and components</text>
<text x="500.0" y="488" class="owner" text-anchor="middle">src/vehicle/</text>
<rect x="660" y="377" width="280" height="128" rx="12" fill="#fff" stroke="#8cbde7"/>
<text x="800.0" y="407" class="title" text-anchor="middle">GNC</text>
<text x="800.0" y="433" class="body" text-anchor="middle">Navigation, guidance</text>
<text x="800.0" y="455" class="body" text-anchor="middle">and control commands</text>
<text x="800.0" y="488" class="owner" text-anchor="middle">src/gnc/</text>
<path d="M200,505 V539" class="arrow"/>
<path d="M500,505 V539" class="arrow"/>
<path d="M800,505 V539" class="arrow"/>
<rect x="80" y="548" width="840" height="112" rx="12" fill="#eaf3fc" stroke="#8cbde7"/>
<text x="500.0" y="578" class="title" text-anchor="middle">Right-hand side: forces, torques and derivatives</text>
<text x="500.0" y="604" class="body" text-anchor="middle">Evaluate effectors and control forces at the requested state and time</text>
<text x="500.0" y="643" class="owner" text-anchor="middle">src/simulation/engine/dynamics_rhs.jl + src/dynamics/</text>
<path d="M500,660 V692" class="arrow"/>
<rect x="80" y="702" width="840" height="100" rx="12" fill="#eaf3fc" stroke="#8cbde7"/>
<text x="500.0" y="732" class="title" text-anchor="middle">Solver and callbacks</text>
<text x="500.0" y="758" class="body" text-anchor="middle">Advance state; update scheduled hooks; save values; detect events</text>
<text x="500.0" y="785" class="owner" text-anchor="middle">src/simulation/engine/ + src/simulation/callbacks/</text>
<path d="M500,802 V879" class="arrow"/>
<text x="520" y="852" class="owner" text-anchor="start">when the run ends</text>
<rect x="150" y="889" width="700" height="110" rx="12" fill="#f2f7fc" stroke="#8cbde7"/>
<text x="500.0" y="919" class="title" text-anchor="middle">Outputs and optional viewer</text>
<text x="500.0" y="945" class="body" text-anchor="middle">Enabled result files, manifest, scene and visualization page</text>
<text x="500.0" y="982" class="owner" text-anchor="middle">src/io/ + src/analysis/visualization/ + viewer/</text>
<text x="500" y="1024" class="owner" text-anchor="middle">Arrows show runtime data flow. Captions identify source owners.</text>
<path d="M458,70 H542" stroke="#ffcb05" stroke-width="4"/>
</svg>
