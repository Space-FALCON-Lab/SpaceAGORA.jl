# Wall shear stress at which a granular surface starts to erode under a
# supersonic plume in a vacuum chamber.
version = 1

[case]
id = "pfgt1_erosion_threshold_shear"
title = "Erosion threshold shear stress, NASA MSFC subscale vacuum tests"
status = "sourced"
gate_eligible = true
summary = """
This is the one published measurement that speaks directly to the fitted
constant the model calls `threshold_shear_pa`. In NASA's Physics Focused Ground
Test 1 (PFGT-1) campaign at Marshall Space Flight Center, a supersonic nitrogen
plume was fired at prepared beds of regolith simulant in the 15-foot vacuum
chamber, and the crater edge was measured optically at five nozzle heights.
Loci/CHEM CFD of the same conditions gives the surface shear stress at each
measured crater edge, and that value is nearly constant across nozzle heights:
it is the shear the surface stops eroding at. The model's counterpart is read
back out of the model itself as the peak wall shear at its erosion onset height,
so the comparison does not depend on any config field surviving.
"""

[source]
authors = "D. C. Stubbs and M. Mehta"
title = "A Data-Derived Scaling Approach for Plume-Surface Interaction Crater Formation"
venue = "AIAA SciTech Forum 2026; NASA Technical Reports Server 20250011216"
year = 2026
locator = "Section IV, discussion of Fig. 14: average crater-edge shear of 0.25 Pa (MDS) and 0.47 Pa (IRR)"
doi = ""
url = "https://ntrs.nasa.gov/citations/20250011216"
access = "open (NTRS full text)"
note = """
Conditions, from the same paper and from the campaign overview (C. J. Eberhart,
J. S. West and A. M. Korzun, "Overview of Plume-Surface Interaction Data from
Subscale Inert Gas Testing at NASA MSFC Test Stand 300 Vacuum Facilities", AIAA
SciTech 2022, NTRS 20210025519): gaseous nitrogen through a nozzle of area ratio
31.7 at exit Mach 5.3; nozzle mass flow 0.32 g/s; ambient pressure 0.02 Torr
(about 2.7 Pa); nozzle heights h/D = 5, 6, 8, 10 and 13; simulants MDS
(mono-disperse silica sand, nominal 125-177 um) and IRR (sieved BP-1 lunar
mechanical simulant, nominal 212-350 um), both at Earth gravity.
Uncertainty: the paper publishes no error bar; it says only that the crater-edge
shear "remains relatively constant" across nozzle heights, and reports the
average. The material-to-material spread between the two simulants is itself a
factor of 1.9, which is the best available measure of how well this number
transfers to another soil.
"""

[conditions]
body = "Earth-gravity vacuum chamber (the reference); the model is evaluated with its lunar defaults"
engine = "PFGT-1 subscale GN2 nozzle (reference); Apollo LM DPS (model)"
thrust_n = 11870.0
thrust_basis = """
The model's threshold shear is a soil property in the model, not an engine
property: `plume_erosion_onset_height` puts the onset where the peak shear
crosses the threshold, so the shear read back at that height is the same number
for any thrust. The Apollo 11 near-hover thrust is supplied only so the readback
has a definite operating point. Orloff, NASA SP-2000-4029, "Selected Mission
Weights (lbs)": "LM at Lunar Landing" = 16,153.2 lb = 7327.0 kg, times
1.62 m/s^2 = 11,870 N.
"""
height_convention = "not applicable; the model's own erosion onset height is used"

[model]
quantity = "threshold_shear_pa"
unit = "Pa"

[tolerance]
kind = "ratio_band"
low = 0.2
high = 5.0
reason = """
A factor of five either way about the 0.25 Pa mono-disperse-sand value. Three
things force the band this wide. The measurement is at Earth gravity on 125 to
350 um sieved simulants, while the model's threshold is meant for lunar mare
regolith at one sixth gravity with a cohesive sub-10 um fraction, and the
threshold for a granular bed scales with both gravity and cohesion. The two
simulants in the same campaign already differ by a factor of 1.9. And the
reference number is not a direct shear measurement at all but a CFD shear
evaluated at an optically measured crater edge, so it carries the CFD's own
turbulence-model uncertainty, which the paper discusses but does not quantify.
"""

[[reference]]
value = 0.25
derived = false
note = "MDS, mono-disperse silica sand 125-177 um; the primary anchor"

[[reference]]
value = 0.47
derived = false
note = "IRR, sieved BP-1 lunar mechanical simulant 212-350 um (context row)"
context_only = true
