# Total mass of lunar soil blown away during one Apollo landing.
version = 1

[case]
id = "apollo_total_eroded_mass"
title = "Total soil eroded during an Apollo landing"
status = "sourced"
gate_eligible = true
summary = """
The model's erosion rate is integrated over the Apollo 12 descent, using the
altitude-versus-time samples the reference itself integrated (its Table 2), and
compared with the published totals for an Apollo landing. Five published
estimates of the same observable are carried here; they span a factor of 22,
which is the honest width of the reference.
"""

[source]
authors = "J. E. Lane and P. T. Metzger"
title = "Estimation of Apollo lunar dust transport using optical extinction measurements"
venue = "Acta Geophysica, vol. 63, no. 2, pp. 568-599"
year = 2015
locator = "Table 3 (comparison of total mass erosion estimates) and Section 3, m_T = 2594 kg"
doi = "10.1515/acgeo-2015-0005"
url = "https://arxiv.org/abs/1503.00154"
access = "author preprint is open (arXiv:1503.00154)"
note = """
Table 3 of this paper collects four estimates for an Apollo landing: Scott
(1975), as interpreted by Metzger, Smith and Lane (2011), 4500 to 6400 kg for
Apollo 12; Metzger et al. (2008) 2400 kg for Apollo 12; Metzger et al. (2010)
1200 kg for the Apollo average; and this paper's own 2600 kg for Apollo 12.
A fifth, much higher estimate was published later: P. T. Metzger, "Erosion rate
of lunar soil under a landing rocket, part 2: Benchmarking and predictions",
Icarus vol. 417, article 116135 (2024), doi:10.1016/j.icarus.2024.116135,
Table 1 and the Conclusions. Fitting a new erosion theory to the blowing-dust
opacity of the Apollo 16 landing video, it gives 11 to 26 t of eroded soil per
Apollo landing and states that this is "4 to 10 times higher than prior
estimates". Its own stated uncertainties are a factor of 2.6 from the
soil-compaction parameter k and +53 / -27 percent from the ultra-fines fraction
of the soil.
The primary anchor scored below is the 2600 kg figure, because it is the one
derived from the very descent profile the model is integrated over here.
"""

[conditions]
body = "Moon"
engine = "Apollo LM descent propulsion system"
thrust_n = 12172.0
thrust_basis = "See apollo12_erosion_rate: 16,564.2 lb landed mass (Orloff, NASA SP-2000-4029) times 1.62 m/s^2."
height_convention = "nozzle exit plane above the undisturbed surface"
integration = """
Trapezoidal in time over the eleven (t, h) samples of the reference's Table 2,
the same quadrature nodes the reference used. The integral is truncated at the
highest analyzed altitude (36.6 m, 50.7 s before touchdown) and at touchdown, so
neither the model nor the reference counts anything outside that window.
"""

[model]
quantity = "eroded_mass_kg"
unit = "kg"

[tolerance]
kind = "ratio_band"
low = 0.1
high = 10.0
reason = """
A factor of ten either way about the 2600 kg anchor, i.e. 260 kg to 26 t. That
band is the published spread itself: the five sourced estimates of this single
observable run from 1200 kg to 26,000 kg. Any narrower band would assert an
accuracy the reference data do not have; any wider one would not be a test.
"""

[[reference]]
value = 2600.0
derived = false
note = "Lane and Metzger (2015), Apollo 12, present work; the primary anchor"

[[reference]]
value = 2400.0
derived = false
note = "Metzger et al. (2008), Apollo 12, as tabulated in Lane and Metzger (2015) Table 3 (context row)"
context_only = true

[[reference]]
value = 1200.0
derived = false
note = "Metzger et al. (2010), Apollo average, as tabulated in Lane and Metzger (2015) Table 3 (context row)"
context_only = true

[[reference]]
value = 5450.0
derived = true
note = "midpoint of Scott (1975) 4500-6400 kg for Apollo 12, as interpreted by Metzger, Smith and Lane (2011) and tabulated in Lane and Metzger (2015) Table 3 (context row)"
context_only = true

[[reference]]
value = 18500.0
derived = true
note = "midpoint of Metzger (2024), Icarus 417 art. 116135, part 2, 11-26 t per Apollo landing, fitted to Apollo 16 (context row)"
context_only = true

