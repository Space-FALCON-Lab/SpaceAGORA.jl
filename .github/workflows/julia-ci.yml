            /usr/lib/google-cloud-sdk /usr/lib/jvm /opt/az /opt/microsoft \
            /opt/pipx /usr/share/miniconda /usr/local/share/chromium \
            /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean > /dev/null 2>&1 || true
          df -h /

      - name: Load pinned dev GRAMSuite revision
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Contract suite
        run: julia --startup-file=no --project=. test/contracts/pr_runtests.jl

  documentation-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
      # No GITHUB_TOKEN here: this job is a build/strictness gate only.
      # Without credentials Documenter's deploydocs skips deployment, which
      # belongs to the Documentation workflow (docs.yml); with the read-only
      # token it attempts the gh-pages push on main and fails with 403.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate runtime environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Build docs
        run: julia --project=. docs/make.jl

      - name: Public API surface gate
        run: julia --startup-file=no --project=. test/gates/ci_public_api_surface_gate.jl

      - name: HPC/extensibility docs gate
        run: julia --startup-file=no --project=. test/gates/ci_hpc_extensibility_docs_gate.jl

  ai-review-artifact-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).
      - name: Free runner disk space
        run: |
          # Jobs have crashed with ENOSPC mid-run (the runner worker dies
          # writing its own logs, so the step never even reports a failure —
          # seen on coverage-quality-gate for main@8e7be423 and PR #35).
          # Reclaim aggressively: none of these preinstalled toolchains are
          # used by Julia CI.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk /usr/lib/jvm /opt/az /opt/microsoft \
            /opt/pipx /usr/share/miniconda /usr/local/share/chromium \
            /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo apt-get clean > /dev/null 2>&1 || true
          df -h /

      - name: Load pinned dev GRAMSuite revision
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Fetch base ref
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: AI review artifact gate
        env:
          SPACEAGORA_PR_NUMBER: ${{ github.event.pull_request.number }}
          SPACEAGORA_BASE_REF: ${{ github.base_ref }}
        run: julia --startup-file=no --project=. test/gates/ci_ai_review_artifact_gate.jl
