# Mass erosion rate of lunar soil under the Apollo 12 Lunar Module (Intrepid)
# as a function of the descent engine's height above the surface.
version = 1

[case]
id = "apollo12_erosion_rate"
title = "Apollo 12 mass erosion rate versus engine height"
status = "sourced"
gate_eligible = true
summary = """
Lane and Metzger measured the optical extinction of the blowing dust in the
Apollo 12 descent film and inverted it, with a measured lunar particle size
distribution and a CFD particle-speed model, into a soil mass erosion rate at
eleven altitudes. Their Table 2 reports the area-specific rate mdot
(kg/s/m^2) and the ideal radius of surface erosion a0 (m) at each altitude.
The total instantaneous erosion rate used here is pi * mdot * a0^2, which is
the integrand of their Eq. (11); summing it with their Eq. (11) quadrature
reproduces their published total of 2594 kg to 0.06 percent, which is the
check that this reading of the table is the one they integrated.
"""

[source]
authors = "J. E. Lane and P. T. Metzger"
title = "Estimation of Apollo lunar dust transport using optical extinction measurements"
venue = "Acta Geophysica, vol. 63, no. 2, pp. 568-599"
year = 2015
locator = "Table 2 (columns h_k, mdot_k, a0_k) with Eq. (11)"
doi = "10.1515/acgeo-2015-0005"
url = "https://arxiv.org/abs/1503.00154"
access = "author preprint is open (arXiv:1503.00154)"
note = """
Height convention: the paper's nomenclature defines h(t) as the nozzle opening
distance from the surface, and its summary repeats that h is "the height of the
engine nozzle opening to the surface". That is the same height the model's
`plume_quantities` takes.
The paper gives no per-row error bar. Two things bound the scatter: the
altitudes come from the crew's spoken altimeter callouts interpolated in time,
and the derived total rate is not monotone in height (69.5 kg/s at 15.2 m
against 49.2 kg/s at 12.8 m), so the row-to-row scatter is of order 40 percent.
The paper separately states that the assumptions about the optical extinction
transition affect the predicted eroded mass "by as much as a factor of 2", and
that the particle velocity function "is likely the source of greatest error".
"""

[conditions]
body = "Moon"
engine = "Apollo LM descent propulsion system"
thrust_n = 12172.0
thrust_basis = """
Near-hover thrust = landed mass * lunar surface gravity. Orloff, Apollo by the
Numbers (NASA SP-2000-4029), "Selected Mission Weights (lbs)" gives "LM at Lunar
Landing" = 16,564.2 lb for Apollo 12, i.e. 7513.4 kg; at g = 1.62 m/s^2 (the
value SpaceAGORA's `Moon()` carries as `g_ref`, consistent with mu/R^2 = 1.625)
that is 12,172 N. Intrepid descended at a few m/s through this altitude band, so
thrust and weight agree to a few percent. The DPS burns about 3.9 kg/s at this
thrust, so the mass at the top of the band (about 51 s before touchdown) was
about 2.6 percent higher; the model's outputs are linear in thrust, so that
shifts every model value here by under 3 percent.
"""
height_convention = "nozzle exit plane above the undisturbed surface"

[model]
quantity = "erosion_kg_s"
unit = "kg/s"

[tolerance]
kind = "ratio_band"
low = 0.33
high = 3.0
reason = """
A factor of three either way. The reference's own row-to-row scatter is about
40 percent, its stated sensitivity to the extinction assumptions is a factor of
2, and the erosion rate itself is the quantity the literature disagrees about
most (see apollo_total_eroded_mass, where published totals for the same landing
span 1.2 t to 26 t, a factor of 22). A band narrower than the spread between
published estimates of the same observable would be a tolerance on the
reference, not on the model.
"""

[[reference]]
height_m = 1.83
value = 98.96
derived = true
note = "pi * 1.26 kg/s/m^2 * (5.0 m)^2; t = 0 s (touchdown)"

