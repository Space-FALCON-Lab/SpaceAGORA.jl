name: Nightly Stress

on:
  schedule:
    - cron: "0 7 * * *"
  pull_request:
  workflow_dispatch:

jobs:
  nightly-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      JULIA_NUM_THREADS: "4"
      SPACEAGORA_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_COVERAGE_MIN_FILE: "80.0"
      SPACEAGORA_COVERAGE_WINDOW_SECONDS: "1200"
      SPACEAGORA_CAL_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_CAL_COVERAGE_MIN_FILE: "70.0"
      SPACEAGORA_CAL_COVERAGE_WINDOW_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      - name: Update GRAMSuite test submodule to dev main
        env:
          GH_TOKEN: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
        run: bash .github/scripts/update_gramsuite_submodule.sh dev

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Instantiate SpaceAGORACalibration
        run: julia --startup-file=no --project=SpaceAGORACalibration.jl -e 'using Pkg; Pkg.instantiate()'

      - name: Instantiate sysimage build environment
        run: julia --startup-file=no --project=build -e 'using Pkg; Pkg.instantiate()'

      - name: Ensure native GRAM build
        run: ./scripts/ensure_gram_native.sh

      - name: Cache SpaceAGORA sysimage
        id: sysimage-cache
        uses: actions/cache@v4
        with:
          path: SpaceAGORA.so
          key: spaceagora-sysimage-${{ runner.os }}-julia-1.12-${{ hashFiles('Project.toml', 'Manifest.toml', 'build/Project.toml', 'build/Manifest.toml', 'build/build_sysimage.jl', 'src/precompile_workload.jl') }}

      - name: Build SpaceAGORA sysimage
        if: steps.sysimage-cache.outputs.cache-hit != 'true'
        env:
          JULIA_IMAGE_THREADS: "1"
          SPACEAGORA_CI_MIN_SYSIMAGE: "1"
        run: julia --startup-file=no --project=build build/build_sysimage.jl

      - name: Fetch base ref (PR only)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Full test suite with coverage
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. --code-coverage=user test/runtests.jl

      - name: Coverage quality gate
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. test/ci_coverage_quality_gate.jl

      - name: SpaceAGORACalibration tests with coverage
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=SpaceAGORACalibration.jl --code-coverage=user SpaceAGORACalibration.jl/test/runtests.jl

      - name: SpaceAGORACalibration coverage quality gate
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=SpaceAGORACalibration.jl SpaceAGORACalibration.jl/test/ci_coverage_quality_gate.jl

      - name: Contract suite
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. test/contracts/nightly_runtests.jl

      - name: AI review artifact gate (PR only)
        if: github.event_name == 'pull_request'
        env:
          SPACEAGORA_PR_NUMBER: ${{ github.event.pull_request.number }}
          SPACEAGORA_BASE_REF: ${{ github.base_ref }}
        run: julia --startup-file=no --sysimage SpaceAGORA.so --project=. test/ci_ai_review_artifact_gate.jl

      - name: Threaded smoke stress
        run: julia --startup-file=no --sysimage SpaceAGORA.so --depwarn=error --project=. test/ci_threaded_smoke.jl

      - name: Example regression stress
        run: julia --startup-file=no --sysimage SpaceAGORA.so --depwarn=error --project=. test/integration/examples/runtests.jl

      - name: Telemetry full regression (GRAM deterministic)
        run: julia --startup-file=no --sysimage SpaceAGORA.so --depwarn=error --project=. benchmarks/studies/telemetry_orbit_accuracy_study.jl full --enforce=true

      - name: Stress suite
        run: julia --startup-file=no --sysimage SpaceAGORA.so --depwarn=error --project=. test/stress/runtests.jl

      - name: Upload telemetry nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-full-${{ github.run_id }}
          path: |
            output/telemetry_orbit_accuracy_summary.csv
            output/telemetry_orbit_accuracy_errors.csv
          if-no-files-found: warn
