name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  statuses: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "2"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # This checkout needs only this repository, including on Dependabot runs.
          token: ${{ github.token }}
          # GRAM retrieval supplies its own scoped credential explicitly.
          persist-credentials: false

      # Prefer the dev tree: the public GRAMSuite's LFS bandwidth is easily
      # exhausted by CI (persistent 502s on the batch endpoint), while the
      # dev repo stores its data without LFS. Fall back to the public tree
      # when the read token cannot reach the dev repo. Setup restores the depot
      # cache that Julia CI's `depot` job fills and never saves one of its own.
      - name: Setup
        uses: ./.github/actions/setup
        with:
          gram: wrapper
          regular-fallback: "true"
          gramsuite-smoke: "false"
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Build and deploy docs
        run: julia --project=. docs/make.jl

      - name: Upload undocumented public API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: undocumented-public-api-${{ github.run_id }}
          path: docs/build/undocumented_public_exports.txt
          if-no-files-found: warn
