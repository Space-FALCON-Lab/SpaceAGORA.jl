[scenario]
phase = "Main"
backend_mode = "spaceagora_physics"
training = true

[reward]
heat_low_w_cm2 = 0.05
heat_high_w_cm2 = 0.25
heat_medium_w_cm2 = 0.30
heat_hard_w_cm2 = 0.45

[termination]
impact_periapsis_altitude_m = 85000.0
out_of_passage_periapsis_altitude_m = 135000.0
max_passes = 2
terminal_on_thermal_violation = true

[randomization]
nominal = false
apoapsis_jitter_m = 2500.0
periapsis_jitter_m = 1000.0
angle_jitter_deg = 0.25
nonnominal_inclination_low_deg = 88.6
nonnominal_inclination_high_deg = 98.6
nonnominal_aop_low_deg = 60.0
nonnominal_aop_high_deg = 90.0
nonnominal_raan_low_deg = 110.0
nonnominal_raan_high_deg = 120.0
process_noise = true
process_noise_scale = 1.0
aerodynamic_coefficient_dispersion = true
aerodynamic_coefficient_span = 0.10
marsgram_perturbation_scale = 1.0
marsgram_seed_base = 1001

[spaceagora_physics]
atmosphere_model = "tabulated_flight"
tabulated_flight_file = "data/telemetry/Odyssey/odyssey_accelerometer_density.feather"
tabulated_flight_sigma = 0.0
gravity_harmonics_degree = 20
gravity_harmonics_order = 20
gravity_harmonics_file = "data/Gravity_harmonics_data/Mars50c.csv"

[ddqn]
learning_rate = 1.0e-4
discount = 0.95
batch_size = 4
train_frequency = 1
train_start = 4
replay_size = 64
target_update = 4
gradient_clip_norm = 10.0
adam_epsilon = 1.0e-6
hidden_dim = 1024

[a2c]
learning_rate = 1.0e-4
discount = 0.95
segment_length = 2
train_start = 0
entropy_coef = 0.1
value_coef = 0.5
gradient_clip_norm = 0.5
adam_epsilon = 1.0e-6
hidden_dim = 1024

[epsilon]
start = 1.0
stop = 0.01
decay_steps = 4
decay_start_step = 4

[training]
seed = 42
algorithm = "pr_drl"
device = "cpu"
global_steps = 4
episodes = 2
max_passes_per_campaign = 2
n_workers = 2
checkpoint_frequency = 2
progress_frequency = 1
output_dir = "SpaceAGORA_RL.jl/outputs/runs_smoke"

[reports]
output_dir = "SpaceAGORA_RL.jl/outputs/reports_smoke"
write_csv = true
write_plots = true
