name: Nightly Stress

on:
  schedule:
    - cron: "0 7 * * *"
  pull_request:
  workflow_dispatch:

jobs:
  nightly-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      JULIA_NUM_THREADS: "4"
      SPACEAGORA_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_COVERAGE_MIN_FILE: "80.0"
      SPACEAGORA_COVERAGE_WINDOW_SECONDS: "1200"
      SPACEAGORA_CAL_COVERAGE_MIN_OVERALL: "90.0"
      SPACEAGORA_CAL_COVERAGE_MIN_FILE: "70.0"
      SPACEAGORA_CAL_COVERAGE_WINDOW_SECONDS: "1200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=.AGORA -e 'using Pkg; Pkg.instantiate()'

      - name: Instantiate SpaceAGORACalibration
        run: julia --startup-file=no --project=SpaceAGORACalibration.jl -e 'using Pkg; Pkg.instantiate()'

      - name: Fetch base ref (PR only)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Full test suite with coverage
        run: julia --startup-file=no --project=.AGORA --code-coverage=user test/runtests.jl

      - name: Coverage quality gate
        run: julia --startup-file=no --project=.AGORA test/ci_coverage_quality_gate.jl

      - name: SpaceAGORACalibration tests with coverage
        run: julia --startup-file=no --project=SpaceAGORACalibration.jl --code-coverage=user SpaceAGORACalibration.jl/test/runtests.jl

      - name: SpaceAGORACalibration coverage quality gate
        run: julia --startup-file=no --project=SpaceAGORACalibration.jl SpaceAGORACalibration.jl/test/ci_coverage_quality_gate.jl

      - name: P1 findings gate
        run: julia --startup-file=no --project=.AGORA test/ci_p1_findings_gate.jl

      - name: Naming contract gate
        run: julia --startup-file=no --project=.AGORA test/ci_naming_contract_gate.jl

      - name: Architecture contract gate
        run: julia --startup-file=no --project=.AGORA test/ci_architecture_contract_gate.jl

      - name: Typed config equivalence gate
        run: julia --startup-file=no --project=.AGORA test/ci_typed_config_equivalence_gate.jl

      - name: Benchmark wrapper parity gate
        run: julia --startup-file=no --project=.AGORA test/ci_benchmark_wrapper_parity_gate.jl

      - name: AI review artifact gate (PR only)
        if: github.event_name == 'pull_request'
        env:
          SPACEAGORA_PR_NUMBER: ${{ github.event.pull_request.number }}
          SPACEAGORA_BASE_REF: ${{ github.base_ref }}
        run: julia --startup-file=no --project=.AGORA test/ci_ai_review_artifact_gate.jl

      - name: Threaded smoke stress
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_threaded_smoke.jl

      - name: Example regression stress
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_examples_regression.jl

      - name: Telemetry full regression (GRAM deterministic)
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/telemetry_orbit_accuracy_study.jl full --enforce=true

      - name: Nightly Monte Carlo stress
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_nightly_montecarlo_stress.jl

      - name: Flake guard
        run: julia --startup-file=no --depwarn=error --project=.AGORA test/ci_flake_guard.jl

      - name: Upload telemetry nightly artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-full-${{ github.run_id }}
          path: |
            output/telemetry_orbit_accuracy_summary.csv
            output/telemetry_orbit_accuracy_errors.csv
          if-no-files-found: warn
