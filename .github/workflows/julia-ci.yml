      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).


      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Contract suite
        run: julia --startup-file=no --project=. test/contracts/pr_runtests.jl

  documentation-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: "4"
      # No GITHUB_TOKEN here: this job is a build/strictness gate only.
      # Without credentials Documenter's deploydocs skips deployment, which
      # belongs to the Documentation workflow (docs.yml); with the read-only
      # token it attempts the gh-pages push on main and fails with 403.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Instantiate runtime environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Build docs
        run: julia --project=. docs/make.jl

      - name: Public API surface gate
        run: julia --startup-file=no --project=. test/gates/ci_public_api_surface_gate.jl

      - name: HPC/extensibility docs gate
        run: julia --startup-file=no --project=. test/gates/ci_hpc_extensibility_docs_gate.jl

  ai-review-artifact-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SPACEFALCON_REPO_READ_TOKEN || github.token }}
          fetch-depth: 0

      # The dev GRAMSuite submodule checkout is ~3 GB; reclaim space first
      # (threaded-smoke has hit ENOSPC on stock ubuntu-latest runners).


      - name: Fetch base ref
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: AI review artifact gate
        env:
          SPACEAGORA_PR_NUMBER: ${{ github.event.pull_request.number }}
          SPACEAGORA_BASE_REF: ${{ github.base_ref }}
        run: julia --startup-file=no --project=. test/gates/ci_ai_review_artifact_gate.jl
